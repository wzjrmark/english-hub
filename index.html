document.addEventListener('keydown', function(e) {
  if (!e.target.classList.contains('sc-in')) return;
  var r = parseInt(e.target.dataset.r), c = parseInt(e.target.dataset.c), nx = null;
  if (e.key === 'Enter' || e.key === 'ArrowDown') nx = document.querySelector(`.sc-in[data-r="${r+1}"][data-c="${c}"]`);
  else if (e.key === 'ArrowUp') nx = document.querySelector(`.sc-in[data-r="${r-1}"][data-c="${c}"]`);
  else if (e.key === 'ArrowRight' && e.target.selectionStart === e.target.value.length) nx = document.querySelector(`.sc-in[data-r="${r}"][data-c="${c+1}"]`);
  else if (e.key === 'ArrowLeft' && e.target.selectionStart === 0) nx = document.querySelector(`.sc-in[data-r="${r}"][data-c="${c-1}"]`);
  if (nx) { e.preventDefault(); nx.focus(); nx.select(); }
});
document.addEventListener('paste', function(e) {
  if (!e.target.classList.contains('sc-in')) return;
  var text = (e.clipboardData || window.clipboardData).getData('text');
  if (!/[\t\n]/.test(text.replace(/[\r\n]+$/, ''))) return;
  e.preventDefault();
  var ex = scExamById(scExamId); if (!ex) return;
  var rows = text.trim().split('\n').map(r => r.split('\t'));
  var r0 = parseInt(e.target.dataset.r), c0 = parseInt(e.target.dataset.c);
  rows.forEach((row, i) => row.forEach((val, j) => {
    var cell = document.querySelector(`.sc-in[data-r="${r0+i}"][data-c="${c0+j}"]`);
    if (!cell) return;
    var v = scParseScore(val);
    cell.value = v === null ? '缺' : (v === undefined ? '' : v);
    scSetScore(ex, cell.dataset.sid, cell.dataset.sub, v);
    cell.className = 'sc-in' + scCellCls(v, parseFloat(cell.dataset.full));
  }));
  saveDB(); renderPage('scores');
  toast('已粘贴 ' + rows.length + ' 行');
});

});

function rwHighlightWord(sentence, word) {
  if (!word || !sentence) return escapeHtml(sentence || '');
  try {
    var escSent = escapeHtml(sentence);
    var escWord = escapeHtml(word);
    var safe = escWord.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    var isPhrase = /\s/.test(word.trim());
    var spanStart = '<span style="background:#8ce99a;color:#065f46;font-weight:700;padding:0 3px;border-radius:3px">';
    if (isPhrase) {
      // Phrase: wrap the whole match ($&)
      var p = new RegExp(safe, 'gi');
      return escSent.replace(p, spanStart + '$&</span>');
    } else {
      // Single word: use capture group $1
      var p2 = new RegExp('\\b(' + safe + '(e[ds]|s|ed|d|ing|er|est|ly)?)\\b', 'gi');
      return escSent.replace(p2, spanStart + '$1</span>');
    }
  } catch(e) { return escapeHtml(sentence); }
}

function rwSetTag(tag) { rwFilterTag = tag; renderPage('readingWords'); }
function rwSetFlashTag(tag) { rwFilterTag = tag; rwRenderFcWordList(); }

// ===== Word Import =====
async function rwImportFile(input) {
  const file = input.files[0];
  input.value = '';
  if (!file) return;
  if (!/\.docx$/i.test(file.name)) { alert('请选择 .docx 文件（.doc请先另存为.docx）'); return; }
  try {
    await new Promise(function(resolve,reject){ window._loadMammoth(resolve); });
    if (typeof mammoth === 'undefined') { alert('文档解析库加载失败，请检查网络'); return; }
    const buf = await file.arrayBuffer();
    const result = await mammoth.convertToHtml({ arrayBuffer: buf });
    rwReadingHtml = result.value || '<p>（文档为空）</p>';
    rwReadingTitle = file.name.replace(/\.[^.]+$/, '');
    renderPage('readingWords');
    toast('✅ 文章加载成功，双击单词可收藏');
  } catch(e) {
    console.error('导入失败:', e);

async function rwOnDblClick(e) {
  const sel = window.getSelection();
  if (!sel.rangeCount || sel.isCollapsed) return;
  const text = sel.toString().trim();
  if (!text || !/^[A-Za-z][A-Za-z'-]*$/.test(text)) return;
  const range = sel.getRangeAt(0);
  const anchorRect = range.getBoundingClientRect();

  // Highlight the word
  const span = document.createElement('span');
  span.style.background = '#8ce99a';
  span.style.color = '#065f46';
  span.style.fontWeight = '700';
  span.style.padding = '0 2px';
  span.style.borderRadius = '3px';
  try {
    const frag = range.extractContents();
    span.appendChild(frag);
    range.insertNode(span);
    window.getSelection().removeAllRanges();
  } catch(err) {}

  rwDblWord = text;
  rwDblSpan = span;
  rwDblSentence = rwExtractSentence(span);

  // Show bubble (fixed position, flip up near bottom)
  const bubble = document.getElementById('rwBubble');
  bubble.style.display = 'block';
  bubble.style.position = 'fixed';
  bubble.style.zIndex = '500';
  const bubbleH = 260; // approximate bubble height
  let left = anchorRect.left;
  let top = anchorRect.bottom + 10;
  // Flip up if near bottom
  if (anchorRect.bottom + bubbleH > window.innerHeight) {
    top = anchorRect.top - bubbleH - 10;
  }
  // Keep within viewport
  if (left + 300 > window.innerWidth) left = window.innerWidth - 310;
  if (left < 10) left = 10;
  if (top < 10) top = 10;
  bubble.style.left = left + 'px';
  bubble.style.top = top + 'px';

  document.getElementById('rwBubbleWord').textContent = text;
  document.getElementById('rwBubblePhonetic').textContent = '';
  document.getElementById('rwBubbleMeaning').textContent = '查询中…';
  document.getElementById('rwBubbleSentence').textContent = rwDblSentence ? '📝 ' + rwDblSentence : '';
  var aiBtn = document.getElementById('rwAiBtn');
  if (aiBtn) { aiBtn.textContent = '✨ AI智能释义+翻译'; aiBtn.disabled = false; }

  // Check if already collected
  const already = (db.readingWords || []).some(w => w.word.toLowerCase() === text.toLowerCase());
  document.getElementById('rwCollectBtn').textContent = already ? '✓ 已收藏' : '⭐ 收藏此词';
  document.getElementById('rwCollectBtn').disabled = already;

  // Fetch dictionary + AI meaning (automatic)
  const info = await rwFetchWordInfo(text);
  document.getElementById('rwBubblePhonetic').textContent = info.phonetic || '';
  document.getElementById('rwBubbleMeaning').textContent = info.chinese || '暂无释义';
  // AI-powered meaning with context
  if (db.settings.ai && db.settings.ai.key) {
    try {
      const ai = db.settings.ai;
      const base = ai.base.replace(/\/+$/, '');
      const prompt = `你是高中英语老师。请完成两件事：
1. 给出单词在该语境下的精准中文释义（含词性）
2. 翻译整句例句为通顺中文

单词：${text}
语境句：${rwDblSentence || '（无）'}

只输出JSON格式：{"meaning":"词性+释义", "sentenceZh":"例句中文翻译"}`;
      const resp = await fetch(base + '/chat/completions', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + ai.key },
        body: JSON.stringify({ model: ai.model || 'deepseek-chat', messages: [{role:'user',content:prompt}], temperature: 0.3, stream: false })
      });
      if (resp.ok) {
        const data = await resp.json();
        const content = (data.choices?.[0]?.message?.content || '').trim();
        try {
          const jm = content.match(/\\{[\\s\\S]*\\}/);
          if (jm) {
            const j = JSON.parse(jm[0]);
            if (j.meaning) {
              document.getElementById('rwBubbleMeaning').textContent = j.meaning;
              document.getElementById('rwBubbleMeaning').style.color = '#16a34a';
              rwAiMeaning = j.meaning;
            }
            if (j.sentenceZh) rwAiSentZh = j.sentenceZh;
          }
        } catch(e) {
          if (content) {
            document.getElementById('rwBubbleMeaning').textContent = content;
            rwAiMeaning = content;
          }
        }
      }
    } catch(e) { console.warn('AI查词失败', e); }
  }
}

function rwExtractSentence(node) {
  const block = node.closest('p, div, h1, h2, h3, h4, li, blockquote, td') || node.parentElement;
  if (!block) return '';
  const text = block.textContent.replace(/\s+/g, ' ').trim();
  // Find sentence boundaries around the word
  const word = node.textContent;
  const idx = text.toLowerCase().indexOf(word.toLowerCase());
  if (idx === -1) return text;
  let start = 0;
  for (let i = idx - 1; i >= 0; i--) {
    const ch = text[i];
    if ('.!?"' .includes(ch) || '。！？'.includes(ch)) { start = i + 1; break; }
  }
  let end = text.length;
  for (let i = idx; i < text.length; i++) {
    const ch = text[i];
    if ('.!?"'.includes(ch) || '。！？'.includes(ch)) { end = i + 1; break; }
  }
  return text.slice(start, end).trim();
}

async function rwFetchWordInfo(word) {
  if (rwZhCache.has(word) && rwPhCache.has(word)) {
    return { phonetic: rwPhCache.get(word), chinese: rwZhCache.get(word) };
  }
  try {
    const [ydRes, dictRes] = await Promise.all([
      fetch(`https://dict.youdao.com/suggest?q=${encodeURIComponent(word)}&num=1&doctype=json&le=en`).then(r => r.json()).catch(() => null),
      fetch(`https://api.dictionaryapi.dev/api/v2/entries/en/${encodeURIComponent(word)}`).then(r => r.json()).catch(() => null)
    ]);
    let phonetic = '', chinese = '';
    const ydEntry = ydRes && ydRes.data && ydRes.data.entries && ydRes.data.entries[0];
    if (ydEntry && ydEntry.explain) chinese = ydEntry.explain.trim();
    if (Array.isArray(dictRes) && dictRes[0]) {
      phonetic = dictRes[0].phonetic || '';
      if (!phonetic && dictRes[0].phonetics) {
        const f = dictRes[0].phonetics.find(p => p.text);
        if (f) phonetic = f.text;
      }
    }
    rwZhCache.set(word, chinese);
    rwPhCache.set(word, phonetic);
    return { phonetic, chinese };
  } catch(e) {
    return { phonetic: '', chinese: '' };
  }
}

    const resp = await fetch(base + '/chat/completions', {

function rwOpenExtFlashcard() {
  var all = db.readingWords || [];
  var synWords = all.filter(function(w){ return (w.tag === '近反义拓展' || w.tag === '高级词替换') && w.group; });
  if (!synWords.length) { alert('还没有拓展数据。请先在批量AI导入里用"近反义+形近词"或"写作高级词替换"模式导入单词。'); return; }
  var gmap = {};
  synWords.forEach(function(w){
    var g = w.group;
    if (!gmap[g]) gmap[g] = [];
    gmap[g].push(w);
  });
  rwExtAllGroups = Object.keys(gmap).map(function(g){
    var items = gmap[g];
    var base = items.find(function(x){ return x.word.toLowerCase() === g.toLowerCase(); }) || items[0];
    var syns = items.filter(function(x){ return x.meaning && x.meaning.indexOf('近义') === 0; });
    var ants = items.filter(function(x){ return x.meaning && x.meaning.indexOf('反义') === 0; });
    var sims = items.filter(function(x){ return x.meaning && x.meaning.indexOf('形近') === 0; });
    return { base: base, syns: syns, ants: ants, sims: sims, tag: base.tag || '' };
  });
  rwExtTagFilter = '全部';
  rwExtApplyTagFilter();
  rwExtShowOverlay();
  rwExtRenderCard();
}

  if (rwExtTagFilter === '全部') {

  if (dbIdx >= 0) db.readingWords.splice(dbIdx, 1);

  rwFlashQueue.splice(rwFlashIndex, 1);

async function rwCollectPhrase() {
  try {
    const sel = window.getSelection();
    if (!sel || !sel.rangeCount || sel.isCollapsed) {
      alert('请先用鼠标选中要收藏的英文短语，再点此按钮');
      return;
    }
    const text = sel.toString().trim();
    if (!text || text.length < 2) { alert('选中内容太短'); return; }
    if (!/[A-Za-z]/.test(text)) { alert('请选择英文内容'); return; }
    // Extract sentence context
    let sentence = '';
    try {
      const range = sel.getRangeAt(0);
      let node = range.commonAncestorContainer;
      if (node.nodeType === 3) node = node.parentElement;
      if (node) {
        // Find the paragraph element
        const p = node.closest ? (node.closest('p, div, li, td') || node) : node;
        const full = (p.textContent || '').replace(/\s+/g, ' ').trim();
        const lower = full.toLowerCase();
        const idx = lower.indexOf(text.toLowerCase());
        if (idx >= 0) {
          let s = 0, e = full.length;
          for (let i = idx - 1; i >= 0; i--) {
            if ('.!?。！？"\''.includes(full[i])) { s = i + 1; break; }
          }
          for (let i = idx + text.length; i < full.length; i++) {
            if ('.!?。！？"\''.includes(full[i])) { e = i + 1; break; }
          }
          sentence = full.slice(s, e).trim();
        }
      }
    } catch(e) {}
    // Check duplicate
    const dup = (db.readingWords || []).some(w => w.word.toLowerCase() === text.toLowerCase());
    if (dup) { alert('该短语已收藏过'); return; }
    // AI meaning
    let meaning = '';
    if (db.settings && db.settings.ai && db.settings.ai.key) {
      try {
        const ai = db.settings.ai;
        const base = (ai.base || 'https://api.deepseek.com').replace(/\/+$/, '');
        const prompt = '你是高中英语老师。请给出以下英文短语的精准中文释义，简洁一句：\n短语：' + text + '\n语境：' + (sentence || '无') + '\n只输出释义。';
        const resp = await fetch(base + '/chat/completions', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + ai.key },
          body: JSON.stringify({ model: ai.model || 'deepseek-chat', messages: [{role:'user',content:prompt}], temperature: 0.3, stream: false })
        });
        if (resp.ok) {
          const data = await resp.json();
          meaning = ((data.choices && data.choices[0] && data.choices[0].message && data.choices[0].message.content) || '').trim();
        }
      } catch(e) { console.warn('AI短语释义失败', e); }
    }
    db.readingWords.push({
      word: text,
      phonetic: '',
      pos: '短语',
      meaning: meaning,
      sentence: sentence,
      sentenceZh: '',
      tag: rwReadingTitle || '',
      note: '',
      type: 'phrase',
      createdAt: new Date().toISOString()
    });
    saveDB();
    rwRefreshSidebar();
    toast('已收藏短语：' + text.slice(0, 30));
  } catch(err) {
    alert('收藏短语失败: ' + err.message);
    console.error(err);
  }
}

// 把多行文本渲染成嵌套黑点列表（• ◦ ▪ – 按缩进层级）
function inspRenderBullets(text) {
  const lines = (text||'').split('\n').filter(l => l.trim());
  if (lines.length === 0) return '';
  const bullets = ['•','◦','▪','–'];
  return lines.map(l => {
    const spaces = (l.match(/^(\s*)/) || [''])[0].length;
    const level = Math.min(Math.floor(spaces / 2), bullets.length - 1);
    const pad = level * 16;
    const b = bullets[level];
    return `<div style="padding-left:${pad+10}px;text-indent:-10px;margin-bottom:2px">${b} ${escapeHtml(l.trim())}</div>`;
  }).join('');
}
function renderInspiration() {
  ensureInspDefaults();
  const cols = db.inspirations.columns;
  const cards = db.inspirations.cards;
  const q = (window.inspSearch || '').toLowerCase();

  let html = `
  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:10px">
    <div>
      <h2 style="margin:0;font-size:22px">💡 灵感看板</h2>
      <p style="margin:4px 0 0;color:var(--ink2);font-size:13px">随手记录教学灵感、课堂点子、待办事项，按列分类推进</p>
    </div>
    <div style="display:flex;gap:8px;align-items:center">
      <input class="inp" placeholder="🔍 搜索卡片..." value="${escapeHtml(window.inspSearch||'')}" oninput="inspSearch=this.value;renderPage('inspiration')" style="width:200px">
      <button class="btn" onclick="inspAddColumn()" style="background:#6366f1;color:#fff;border:none">+ 新增列</button>
    </div>
  </div>
  <div style="display:flex;gap:14px;overflow-x:auto;padding-bottom:16px;align-items:flex-start;min-height:60vh">
  `;

  cols.forEach(col => {
    let colCards = cards.filter(c => c.colId === col.id);
    if (q) colCards = colCards.filter(c => (c.title+c.content+(c.tags||[]).join(' ')).toLowerCase().includes(q));
    colCards.sort((a,b) => (b.createdAt||0) - (a.createdAt||0));

    html += `
    <div style="min-width:260px;max-width:300px;flex:1;background:#e8f0fe;border-radius:12px;display:flex;flex-direction:column;max-height:calc(100vh - 180px)">
      <div style="padding:12px 14px;border-bottom:3px solid ${col.accent};display:flex;align-items:center;justify-content:space-between">
        <div style="font-weight:700;font-size:14px">${escapeHtml(col.title)} <span style="color:var(--ink2);font-weight:400;font-size:12px">(${colCards.length})</span></div>
        <div style="display:flex;gap:4px">
          <button onclick="inspEditColumn('${col.id}')" style="border:none;background:transparent;cursor:pointer;font-size:14px" title="重命名">✏️</button>
          <button onclick="inspDelColumn('${col.id}')" style="border:none;background:transparent;cursor:pointer;font-size:14px" title="删除列">🗑</button>
        </div>
      </div>
      <div id="insp-col-${col.id}" style="flex:1;overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:8px;min-height:60px" ondragover="event.preventDefault();this.style.background='rgba(59,130,246,.12)'" ondragleave="this.style.background=''" ondrop="event.preventDefault();this.style.background='';inspDropCard(event,'${col.id}')">
    `;

    colCards.forEach(card => {
      const tags = (card.tags||[]).map(t => `<span style="display:inline-block;background:#e0e7ff;color:#4338ca;font-size:11px;padding:1px 7px;border-radius:10px;margin:2px 2px 0 0">${escapeHtml(t)}</span>`).join('');
      html += `
      <div draggable="true" ondragstart="event.dataTransfer.setData('text/plain','${card.id}');event.stopPropagation()" onclick="inspEditCard('${card.id}')" style="background:#fff;border-radius:8px;padding:10px 12px;box-shadow:0 1px 3px rgba(0,0,0,.08);cursor:grab;border-left:3px solid ${col.accent};transition:transform .15s" onmouseover="this.style.transform='translateY(-1px)'" onmouseout="this.style.transform=''">
        <div style="font-weight:600;font-size:14px;margin-bottom:4px">${escapeHtml(card.title)}</div>
        ${card.content ? `<div style="font-size:12.5px;color:var(--ink2);line-height:1.6;margin-bottom:4px;max-height:180px;overflow-y:auto;padding-left:2px">` + inspRenderBullets(card.content) + `</div>` : ''}
        ${tags}
        <div style="display:flex;justify-content:space-between;align-items:center;margin-top:6px">
          <span style="font-size:11px;color:#94a3b8">${card.createdAt ? new Date(card.createdAt).toLocaleDateString('zh-CN',{month:'numeric',day:'numeric'}) : ''}</span>
          <div style="display:flex;align-items:center;gap:4px" onclick="event.stopPropagation()">
            <select onchange="inspMoveCard('${card.id}', this.value)" style="font-size:11px;border:1px solid #e2e8f0;border-radius:4px;padding:1px 4px;cursor:pointer;background:#f8fafc">
              ${cols.map(c => `<option value="${c.id}" ${c.id===col.id?'selected':''}>${escapeHtml(c.title)}</option>`).join('')}
            </select>
            <button onclick="inspDelCard('${card.id}')" style="border:none;background:transparent;cursor:pointer;font-size:13px;color:#ef4444" title="删除">✕</button>
          </div>
        </div>
      </div>`;
    });

    html += `
      </div>
      <button onclick="inspAddCard('${col.id}')" style="margin:8px;padding:8px;background:transparent;border:1px dashed #cbd5e1;border-radius:8px;cursor:pointer;font-size:13px;color:var(--ink2)">+ 添加卡片</button>
    </div>`;
  });

  html += '</div>';
  return html;
}

// 纯文本黑点编辑：textarea 里直接显示 • ◦ ▪ – 字符，光标原生支持
const INSP_BULLETS = ['•','◦','▪','–'];

// 存储格式（行首空格=层级） → 编辑框显示（行首空格+黑点+空格）
function inspToDisplay(text) {
  return (text||'').split('\n').map(l => {
    const spaces = (l.match(/^(\s*)/) || [''])[0].length;
    const level = Math.min(Math.floor(spaces / 2), 3);
    return '  '.repeat(level) + INSP_BULLETS[level] + ' ' + l.trim();
  }).join('\n');
}
// 编辑框显示 → 存储格式（去掉黑点字符，保留行首空格）
function inspToStorage(display) {
  return display.split('\n').map(l => {
    const spaces = (l.match(/^(\s*)/) || [''])[0].length;
    const level = Math.min(Math.floor(spaces / 2), 3);
    const rest = l.slice(spaces).replace(/^[•◦▪–]\s*/, '');
    return '  '.repeat(level) + rest;
  }).join('\n');
}

function inspModal({ title, fields, onSave }) {
  const overlay = document.createElement('div');
  overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:9999;display:flex;align-items:center;justify-content:center';
  let fieldsHtml = fields.map(f => {
    if (f.type === 'textarea') {
      const displayVal = escapeHtml(inspToDisplay(f.value||''));
      return `<div style="margin-bottom:12px">
        <label style="display:block;font-size:13px;font-weight:600;margin-bottom:4px;color:var(--ink)">${f.label}</label>
        <div style="display:flex;gap:4px;margin-bottom:4px">
          <button type="button" onclick="inspIndent('${f.id}',1)" title="增加缩进" style="padding:3px 10px;border:1px solid #e2e8f0;background:#f8fafc;border-radius:6px;cursor:pointer;font-size:13px">⇥ 缩进</button>
          <button type="button" onclick="inspIndent('${f.id}',-1)" title="升一级" style="padding:3px 10px;border:1px solid #e2e8f0;background:#f8fafc;border-radius:6px;cursor:pointer;font-size:13px">⇤ 升一级</button>
          <span style="flex:1"></span>
          <span style="font-size:11px;color:#94a3b8;align-self:center">Tab/Shift+Tab 缩进</span>
        </div>
        <textarea id="${f.id}" rows="8" style="width:100%;padding:10px 12px;border:1px solid #e2e8f0;border-radius:8px;font-size:14px;line-height:1.8;font-family:'SF Mono',Menlo,monospace;resize:vertical;box-sizing:border-box" onkeydown="inspTextareaKey(event,'${f.id}')">${displayVal}</textarea>
      </div>`;
    }
    return `<div style="margin-bottom:12px">
      <label style="display:block;font-size:13px;font-weight:600;margin-bottom:4px;color:var(--ink)">${f.label}</label>
      <input id="${f.id}" type="text" value="${escapeHtml(f.value||'')}" style="width:100%;padding:8px 10px;border:1px solid #e2e8f0;border-radius:8px;font-size:14px;box-sizing:border-box">
    </div>`;
  }).join('');
  overlay.innerHTML = `
    <div style="background:#fff;border-radius:14px;padding:24px;width:560px;max-width:92vw;max-height:88vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.2)">
      <h3 style="margin:0 0 16px;font-size:18px">${escapeHtml(title)}</h3>
      ${fieldsHtml}
      <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:16px">
        <button onclick="this.closest('[data-overlay]').remove()" style="padding:8px 16px;border-radius:8px;border:1px solid #e2e8f0;background:#fff;cursor:pointer;font-size:14px">取消</button>
        <button id="inspSaveBtn" style="padding:8px 20px;border-radius:8px;border:none;background:#6366f1;color:#fff;cursor:pointer;font-size:14px;font-weight:600">保存</button>
      </div>
    </div>`;
  overlay.setAttribute('data-overlay', '1');
  document.body.appendChild(overlay);
  overlay.addEventListener('click', e => { if (e.target === overlay) overlay.remove(); });
  // focus: title input → cursor at end; textarea → cursor at end
  const firstInput = overlay.querySelector('input[type="text"]');
  const firstTA = overlay.querySelector('textarea');
  if (firstInput) {
    firstInput.focus();
    firstInput.setSelectionRange(firstInput.value.length, firstInput.value.length);
  } else if (firstTA) {
    firstTA.focus();
    firstTA.selectionStart = firstTA.selectionEnd = firstTA.value.length;
  }
  overlay.querySelector('#inspSaveBtn').onclick = () => {
    const values = {};
    fields.forEach(f => {
      if (f.type === 'textarea') {
        values[f.id] = inspToStorage(document.getElementById(f.id).value);
      } else {
        values[f.id] = document.getElementById(f.id).value;
      }
    });
    overlay.remove();
    onSave(values);
  };
}

// Tab key in textarea
function inspTextareaKey(e, id) {
  if (e.key === 'Tab') {
    e.preventDefault();
    inspIndent(id, e.shiftKey ? -1 : 1);
  }
}

// 对选中行（或当前行）加/减两个空格，并重画该行的黑点
function inspIndent(id, dir) {
  const ta = document.getElementById(id);
  if (!ta) return;
  const start = ta.selectionStart, end = ta.selectionEnd;
  const val = ta.value;
  let lineStart = val.lastIndexOf('\n', start - 1) + 1;
  let lineEnd = val.indexOf('\n', end);
  if (lineEnd === -1) lineEnd = val.length;
  const block = val.slice(lineStart, lineEnd);
  const lines = block.split('\n').map(l => {
    // strip current bullet
    const spaces = (l.match(/^(\s*)/) || [''])[0].length;
    let level = Math.min(Math.floor(spaces / 2), 3);
    const text = l.slice(spaces).replace(/^[•◦▪–]\s*/, '');
    level = Math.max(0, Math.min(3, level + dir));
    return '  '.repeat(level) + INSP_BULLETS[level] + ' ' + text;
  });
  const newBlock = lines.join('\n');
  ta.value = val.slice(0, lineStart) + newBlock + val.slice(lineEnd);
  ta.selectionStart = lineStart;
  ta.selectionEnd = lineStart + newBlock.length;
  ta.focus();
}

function inspAddColumn() {
  inspModal({
    title: '新增列',
    fields: [{ id: 'title', label: '列名称', value: '', type: 'text' }],
    onSave: v => {
      if (!v.title.trim()) return;
      ensureInspDefaults();
      const colors = ['#f59e0b','#3b82f6','#ec4899','#10b981','#8b5cf6','#f97316'];
      const color = colors[db.inspirations.columns.length % colors.length];
      db.inspirations.columns.push({ id: uid(), title: v.title.trim(), accent: color });
      saveDB(); renderPage('inspiration');
    }
  });
}

function inspEditColumn(id) {
  const col = db.inspirations.columns.find(c => c.id === id);
  if (!col) return;
  inspModal({
    title: '重命名列',
    fields: [{ id: 'title', label: '列名称', value: col.title, type: 'text' }],
    onSave: v => {
      if (v.title.trim()) col.title = v.title.trim();
      saveDB(); renderPage('inspiration');
    }
  });
}

function inspDelColumn(id) {
  if (!confirm('删除此列？该列下的卡片也会删除。')) return;
  db.inspirations.columns = db.inspirations.columns.filter(c => c.id !== id);
  db.inspirations.cards = db.inspirations.cards.filter(c => c.colId !== id);
  saveDB(); renderPage('inspiration');
}

function inspAddCard(colId) {
  inspEditCard(null, colId);
}

function inspEditCard(cardId, colId) {
  ensureInspDefaults();
  let card = cardId ? db.inspirations.cards.find(c => c.id === cardId) : null;
  const isNew = !card;
  if (isNew) card = { id: uid(), colId, title: '', content: '', tags: [], createdAt: Date.now() };

  inspModal({
    title: isNew ? '新增卡片' : '编辑卡片',
    fields: [
      { id: 'title', label: '标题', value: card.title, type: 'text' },
      { id: 'content', label: '详细内容', value: card.content, type: 'textarea', rows: 5 },
      { id: 'tags', label: '标签（逗号分隔）', value: (card.tags||[]).join(', '), type: 'text' }
    ],
    onSave: v => {
      card.title = v.title.trim();
      card.content = v.content.trim();
      card.tags = v.tags.split(/[,，]/).map(t => t.trim()).filter(Boolean);
      if (isNew) db.inspirations.cards.push(card);
      saveDB(); renderPage('inspiration');
    }
  });
}

function inspDropCard(event, newColId) {
  const cardId = event.dataTransfer.getData('text/plain');
  if (cardId) inspMoveCard(cardId, newColId);
}

function inspMoveCard(id, newColId) {
  const card = db.inspirations.cards.find(c => c.id === id);
  if (card) { card.colId = newColId; saveDB(); renderPage('inspiration'); }
}

function inspDelCard(id) {
  if (!confirm('删除此卡片？')) return;
  db.inspirations.cards = db.inspirations.cards.filter(c => c.id !== id);
  saveDB(); renderPage('inspiration');
}


</script>
