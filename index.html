    + '</div></div></div>';
  // 挂到 #app 内，跟随全局 zoom（右侧浮动 A-/A+ 可调字号）
  document.getElementById('app').appendChild(root);
  renderTpTestList();
}

function renderTpTestList() {
  var list = db.trackPractice || [];
  var allTags = [...new Set(list.map(function(t){ return t.kpTag; }).filter(Boolean))];
  var curTag = window.tpTestTag || 'all';

  var tagBox = document.getElementById('tpTestTags');
  if (tagBox) {
    var h = '<button class="' + (curTag==='all' ? 'on' : '') + '" onclick="window.tpTestTag=\'all\';renderTpTestList()">全部 (' + list.length + ')</button>';
    h += allTags.map(function(t){
      return '<button class="' + (curTag === t ? 'on' : '') + '" onclick="window.tpTestTag=\'' + t.replace(/'/g, "\\'") + '\';renderTpTestList()">' + escapeHtml(t) + ' (' + list.filter(function(x){return x.kpTag === t;}).length + ')</button>';
    }).join('');
    tagBox.innerHTML = h;
  }

  var sort = window.tpTestSort || 'desc';
  var btns = document.querySelectorAll('#tpTestSetup .seg button');
  if (btns.length === 2) {
    btns[0].style.background = sort==='desc' ? '#7c5ce7' : '';
    btns[0].style.color = sort==='desc' ? '#fff' : '';
    btns[1].style.background = sort==='asc' ? '#7c5ce7' : '';
    btns[1].style.color = sort==='asc' ? '#fff' : '';
  }

  var filtered = list.map(function(t, idx){ return { t: t, idx: idx }; });
  if (curTag !== 'all') filtered = filtered.filter(function(x){ return x.t.kpTag === curTag; });
  var kw = (window.tpTestSearch || '').trim().toLowerCase();
  if (kw) {
    filtered = filtered.filter(function(x){
      return (x.t.question||'').toLowerCase().includes(kw)
        || (x.t.answer||'').toLowerCase().includes(kw)
        || (x.t.kpTag||'').toLowerCase().includes(kw)
        || (x.t.reason||'').toLowerCase().includes(kw);
    });
  }
  filtered.sort(function(a, b){
    var da = a.t.date || '', dbv = b.t.date || '';
    if (da !== dbv) return sort === 'asc' ? da.localeCompare(dbv) : dbv.localeCompare(da);
    return sort === 'asc' ? a.idx - b.idx : b.idx - a.idx;
  });

  var listEl = document.getElementById('tpTestList');
  if (!listEl) return;
  listEl.innerHTML = filtered.length === 0
    ? '<div style="padding:24px;text-align:center;color:#7c5ce7;font-size:13px">没有匹配的题目</div>'
    : filtered.map(function(x){
        var t = x.t;
        var preview = (t.question || '').replace(/\s+/g,' ').slice(0,50);
        var checked = t.status !== 'done' ? 'checked' : '';
        var statusDot = t.status === 'done'
          ? '<span style="font-size:11px;color:#16a34a;margin-right:6px">✓已掌握</span>'
          : '<span style="font-size:11px;color:#e89a0c;margin-right:6px">●待巩固</span>';
        var tag = t.kpTag ? ('<span style="font-size:11px;color:#7c5ce7;margin-right:6px">#' + escapeHtml(t.kpTag) + '</span>') : '';
        return '<div style="display:flex;align-items:center;gap:10px;padding:10px 14px;background:#fff;border:1px solid #ddd6fe;border-radius:10px">'
          + '<input type="checkbox" ' + checked + ' data-idx="' + x.idx + '">'
          + statusDot + tag
          + '<span style="font-size:13px;color:#5b21b6;margin-left:auto;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">' + escapeHtml(preview) + '</span>'
          + '</div>';
      }).join('');

  var cntEl = document.getElementById('tpTestCount');
  if (cntEl) cntEl.textContent = '共 ' + filtered.length + ' 题';
}

function setTpSort(s) {
  window.tpTestSort = s;
  renderTpTestList();
}

function tpTestSelectAll(checked) {
  document.querySelectorAll('#tpTestList input[type="checkbox"]').forEach(function(c){ c.checked = checked; });
}

function startTpTest() {
  var checked = [].slice.call(document.querySelectorAll('#tpTestList input:checked'));
  if (!checked.length) { toast('请先勾选题目'); return; }
  var list = db.trackPractice || [];
  tpTestQueue = checked.map(function(c){ return list[parseInt(c.dataset.idx)]; });
  var sh = document.getElementById('tpShuffleChk');
  if (sh && sh.checked) {
    for (var i = tpTestQueue.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var tmp = tpTestQueue[i]; tpTestQueue[i] = tpTestQueue[j]; tpTestQueue[j] = tmp;
    }
  }
  tpTestIndex = 0;

  var card = document.createElement('div');
  card.id = 'tpTestCard';
  card.style.cssText = 'display:flex;position:fixed;inset:0;z-index:410;background:#faf5ff;flex-direction:column';
  card.innerHTML =
    '<div style="position:fixed;left:24px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:12px;z-index:420" onclick="event.stopPropagation()">'
    + '<button onclick="tpPrevCard()" style="width:48px;height:48px;border-radius:12px;border:1px solid #ddd6fe;background:#fff;color:#7c5ce7;cursor:pointer;font-size:20px;box-shadow:0 2px 8px rgba(124,92,231,.15)">↑</button>'
    + '<button onclick="tpNextCard()" style="width:48px;height:48px;border-radius:12px;border:1px solid #ddd6fe;background:#fff;color:#7c5ce7;cursor:pointer;font-size:20px;box-shadow:0 2px 8px rgba(124,92,231,.15)">↓</button>'
    + '<button onclick="closeTpTest()" style="width:48px;height:48px;border-radius:12px;border:1px solid #fecaca;background:#fff;color:#dc2626;cursor:pointer;font-size:18px;box-shadow:0 2px 8px rgba(220,38,38,.15)">✕</button>'
    + '</div>'
    + '<div style="flex:1;display:flex;flex-direction:column;padding:16px 40px 16px 90px;overflow:hidden">'
    + '<div style="text-align:center;margin-bottom:12px;flex-shrink:0">'
    + '<span id="tpProgress" style="font-size:20px;font-weight:700;background:#ddd6fe;padding:4px 20px;border-radius:20px;box-shadow:0 4px 12px rgba(221,214,254,.6);color:#5b21b6">1 / 1</span>'
    + '<span id="tpKpTag" style="margin-left:10px;font-size:14px;color:#7c5ce7"></span>'
    + '</div>'
    + '<div style="flex:1;display:flex;flex-direction:column;gap:10px;max-width:1400px;width:100%;margin:0 auto;min-height:0">'
    + '<div style="flex:1;display:grid;grid-template-columns:1fr 1fr;gap:10px;min-height:0">'
    + '<div style="background:#fff;border-radius:12px;box-shadow:0 2px 12px rgba(124,92,231,.1);padding:20px;overflow-y:auto;height:100%">'
    + '<div style="font-size:14px;color:#6b7280;font-weight:700;margin-bottom:10px">📄 题干</div>'
    + '<div id="tpCardQuestion" style="font-size:18px;color:#1f2937;line-height:1.9"></div></div>'
    + '<div style="background:#fff;border-radius:12px;box-shadow:0 2px 12px rgba(124,92,231,.1);padding:20px;overflow-y:auto;height:100%">'
    + '<div style="font-size:14px;color:#6b7280;font-weight:700;margin-bottom:10px">📋 选项</div>'
    + '<div id="tpCardOptions" style="font-size:18px;color:#1f2937;line-height:1.9"></div></div>'
    + '</div>'
    + '<div id="tpAnswerPlaceholder" style="height:120px;flex-shrink:0;background:#fff;border:2px dashed #c4b5fd;border-radius:12px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#7c5ce7;font-size:15px;font-weight:600" onclick="document.getElementById(\'tpAnswerBox\').classList.remove(\'hidden\');this.style.display=\'none\'">'
    + '👆 点这里显示答案与解析</div>'
    + '<div id="tpAnswerBox" class="hidden" style="background:#faf5ff;border:2px solid #c4b5fd;border-radius:12px;padding:20px;overflow-y:auto;flex-shrink:0;max-height:240px;cursor:pointer" onclick="this.classList.add(\'hidden\');document.getElementById(\'tpAnswerPlaceholder\').style.display=\'flex\'">'
    + '<div style="font-size:14px;color:#7c5ce7;font-weight:700;margin-bottom:10px">✅ 正确答案与解析</div>'
    + '<div id="tpCardAnswer" style="font-size:20px;color:#5b21b6;font-weight:700;margin-bottom:10px"></div>'
    + '<div id="tpCardReason" style="font-size:15px;color:#92400e;line-height:1.8;padding:12px 14px;background:#fffbeb;border-radius:8px;border-left:3px solid #f59e0b"></div>'
    + '</div></div></div></div>';
  // 同样挂到 #app 内，跟随全局字号
  document.getElementById('app').appendChild(card);
  document.getElementById('tpTestSetup').style.display = 'none';
  showTpCard();
}

function showTpCard() {
  var t = tpTestQueue[tpTestIndex];
  document.getElementById('tpProgress').textContent = (tpTestIndex + 1) + ' / ' + tpTestQueue.length;
  document.getElementById('tpKpTag').textContent = t.kpTag ? ('#' + t.kpTag) : '';
  document.getElementById('tpCardQuestion').innerHTML = formatMarkdown(t.question || '');
  document.getElementById('tpCardOptions').innerHTML = t.options ? formatMarkdown(t.options) : '<span style="color:#999">（无选项）</span>';
  document.getElementById('tpCardAnswer').innerHTML = formatMarkdown(t.answer || '');
  var rb = document.getElementById('tpCardReason');
  if (t.reason) { rb.style.display = 'block'; rb.innerHTML = formatMarkdown(t.reason); }
  else { rb.style.display = 'none'; }
  document.getElementById('tpAnswerBox').classList.add('hidden');
  document.getElementById('tpAnswerPlaceholder').style.display = 'flex';
}

function tpNextCard() {
  if (tpTestIndex < tpTestQueue.length - 1) { tpTestIndex++; showTpCard(); }
  else { toast('已经是最后一题，点 ✕ 退出测试'); }
}

function tpPrevCard() {
  if (tpTestIndex > 0) { tpTestIndex--; showTpCard(); }
}

function closeTpTest() {
  var root = document.getElementById('tpTestRoot');
  if (root) root.remove();
  var card = document.getElementById('tpTestCard');
  if (card) card.remove();
  renderPage('trackPractice');
}

// 错题测试模式
let errTestQueue = [], errTestIndex = 0;

function openErrorTest() {
  window.errTestSearch = '';
  window.errTestTag = 'all';
  window.errTestSort = 'desc';
  const si = document.getElementById('errTestSearchInput');
  if (si) si.value = '';
  document.getElementById('errTestSetup').style.display = 'flex';
  renderErrTestList();
}

function closeErrorTest() {
  document.getElementById('errTestSetup').style.display = 'none';
  document.getElementById('errTestCard').style.display = 'none';
}

function renderErrTestList() {
  const list = document.getElementById('errTestList');
  const all = db.errors || [];

  // 标签 chips（支持逗号分隔多标签）
  const splitTags = t => (t||'').split(/[,，、;；]/).map(s=>s.trim()).filter(Boolean);
  const allTags = [...new Set(all.flatMap(e => splitErrTags(e.errorType)))];
  const tagBox = document.getElementById('errTestTags');
  const curTag = window.errTestTag || 'all';
  if (tagBox) {
    let html = '<button class="' + (curTag==='all' ? 'on' : '') + '" onclick="window.errTestTag=\'all\';renderErrTestList()">全部 (' + all.length + ')</button>';
    html += allTags.map(t =>
      '<button class="' + (curTag === t ? 'on' : '') + '" onclick="window.errTestTag=\'' + t.replace(/'/g, "\\'") + '\';renderErrTestList()">' + escapeHtml(t) + ' (' + all.filter(e=>splitErrTags(e.errorType).includes(t)).length + ')</button>'
    ).join('');
    tagBox.innerHTML = html;
  }

  // 排序按钮高亮
  const sort = window.errTestSort || 'desc';
  const btns = document.querySelectorAll('#errTestSetup .seg button');
  if (btns.length === 2) {
    btns[0].style.background = sort==='desc' ? '#16a34a' : '';
    btns[0].style.color = sort==='desc' ? '#fff' : '';
    btns[1].style.background = sort==='asc' ? '#16a34a' : '';
    btns[1].style.color = sort==='asc' ? '#fff' : '';
  }

  // 过滤 + 保留原始下标
  let filtered = all.map((e, idx) => ({ e: e, idx: idx }));
  if (curTag !== 'all') filtered = filtered.filter(x => splitErrTags(x.e.errorType).includes(curTag));
  const kw = (window.errTestSearch || '').trim().toLowerCase();
  if (kw) {
    filtered = filtered.filter(x =>
      (x.e.question||'').toLowerCase().includes(kw) ||
      (x.e.answer||'').toLowerCase().includes(kw) ||
      (x.e.errorType||'').toLowerCase().includes(kw) ||
      (x.e.kpTag||'').toLowerCase().includes(kw)
    );
  }
  // 按日期排序
  filtered.sort((a, b) => {
    const da = a.e.date || '', dbv = b.e.date || '';
    if (da !== dbv) return sort === 'asc' ? da.localeCompare(dbv) : dbv.localeCompare(da);
    return sort === 'asc' ? a.idx - b.idx : b.idx - a.idx;
  });

  list.innerHTML = filtered.length === 0
    ? '<div style="padding:24px;text-align:center;color:#16a34a;font-size:13px">没有匹配的错题</div>'
    : filtered.map(function(x) {
        const e = x.e;
        return '<div style="display:flex;align-items:center;gap:10px;padding:10px 14px;background:#fff;border:1px solid #bbf7d0;border-radius:10px">' +
          '<input type="checkbox" checked data-idx="' + x.idx + '">' +
          '<span style="font-size:13px;font-weight:600;color:#166534">' + escapeHtml(e.studentName) + '</span>' +
          '<span style="font-size:11px;color:#dc2626">' + escapeHtml(e.errorType || '') + '</span>' +
          '<span style="font-size:13px;color:#16a34a;margin-left:auto;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">' + escapeHtml((e.question || '').slice(0, 50)) + '</span>' +
          '</div>';
      }).join('');

  const cntEl = document.getElementById('errTestCount');
  if (cntEl) cntEl.textContent = '共 ' + filtered.length + ' 题';
}

function setErrSort(s) {
  window.errTestSort = s;
  renderErrTestList();
}

function errTestSelectAll(checked) {
  document.querySelectorAll('#errTestList input[type="checkbox"]').forEach(c => c.checked = checked);
}

function startErrorTest() {
  const checked = [...document.querySelectorAll('#errTestList input:checked')];
  if (!checked.length) { toast('请先勾选错题'); return; }
  const errs = db.errors || [];
  errTestQueue = checked.map(c => errs[parseInt(c.dataset.idx)]);
  if (document.getElementById('errShuffleChk').checked) {
    for (let i = errTestQueue.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [errTestQueue[i], errTestQueue[j]] = [errTestQueue[j], errTestQueue[i]];
    }
  }
  errTestIndex = 0;
  document.getElementById('errTestSetup').style.display = 'none';
  document.getElementById('errTestCard').style.display = 'flex';
  showErrCard();
}

function fmtErrText(t) {
  if (!t) return '';
  // § N § → 下划线填空空
  return t.replace(/§\s*(\d+)\s*§/g, '<span style="display:inline-block;min-width:48px;border-bottom:2px solid #16a34a;text-align:center;color:#16a34a;font-weight:600;margin:0 2px">&nbsp;</span>');
}
function showErrCard() {
  const e = errTestQueue[errTestIndex];
  document.getElementById('errProgress').textContent = (errTestIndex + 1) + ' / ' + errTestQueue.length;
  document.getElementById('errCardQuestion').innerHTML = fmtErrText(formatMarkdown(e.question || ''));
  document.getElementById('errCardOptions').innerHTML = e.options ? formatMarkdown(e.options) : '<span style="color:#999">（无选项）</span>';
  document.getElementById('errCardAnswer').innerHTML = formatMarkdown(e.answer || '');
  const reasonBox = document.getElementById('errCardReason');
  if (e.reason) { reasonBox.style.display = 'block'; reasonBox.innerHTML = formatMarkdown(e.reason); }
  else { reasonBox.style.display = 'none'; }
  // 切换卡片时重置答案隐藏状态
  document.getElementById('errAnswerBox').classList.add('hidden');
  document.getElementById('errAnswerPlaceholder').style.display = 'flex';
}

function errNextCard() {
  if (errTestIndex < errTestQueue.length - 1) { errTestIndex++; showErrCard(); }
}

function errPrevCard() {
  if (errTestIndex > 0) { errTestIndex--; showErrCard(); }
}

let lastSentencesText = '';
let currentGeneratedSentences = []; // 临时存当前生成的句子，避免onclick转义问题

async function generateSentences() {
  const pattern = document.getElementById('sentPattern').value.trim();
  const phrase = document.getElementById('sentPhrase').value.trim();
  const count = document.getElementById('sentCount').value;
  const topic = document.getElementById('sentTopic').value;

  if (!pattern && !phrase && !topic) { toast('请至少输入句式、短语或话题'); return; }

  if (!db.settings.ai || !db.settings.ai.key) {
    toast('请先在设置里配置AI接口和API Key');
    return;
  }

  const btn = document.getElementById('genSentBtn');
  const resultDiv = document.getElementById('sentResult');

  btn.disabled = true;
  btn.innerHTML = '<span style="display:inline-block;width:12px;height:12px;border:2px solid currentColor;border-top-color:transparent;border-radius:50%;animation:spin .8s linear infinite"></span> 生成中...';
  resultDiv.innerHTML = '<div style="color:var(--ink3);font-size:13px;padding:12px">AI 正在生成例句...</div>';

  try {
    var reqParts = [];
    if (pattern) reqParts.push('【固定句式】' + pattern + '（每句必须使用此句式结构）');
    if (phrase) reqParts.push('【核心短语/词汇】' + phrase + '（每句必须包含此短语）');
    if (topic) reqParts.push('【话题场景】' + topic);
    reqParts.push('【生成数量】' + count + '句');

    const prompt = '你是高中英语老师。请按照下面的要求生成例句：\n\n' + reqParts.join('\n') + '\n\n【要求】\n1. 例句围绕给定话题场景，贴近高中生真实生活\n2. 地道自然，符合高考写作和口语的常用表达\n3. 难度适合高中学生\n4. 每句后面用中文翻译\n5. 格式：每句单独一行，英文在前，中文在后面括号里';

    const ai = db.settings.ai;
    const base = ai.base.replace(/\/+$/, '');
    const headers = { 'Content-Type': 'application/json' };
    if (ai.key) headers['Authorization'] = 'Bearer ' + ai.key;
    
    const resp = await fetch(base + '/chat/completions', {
      method: 'POST',
      headers,
      body: JSON.stringify({
        model: ai.model,
        messages: [
          { role: 'system', content: '你是资深高中英语老师，擅长编写地道、实用、适合学生的英语例句。' },
          { role: 'user', content: prompt }
        ],
        stream: false,
        temperature: 0.7
      })
    });
    
    if (!resp.ok) {
      const errText = await resp.text();
      throw new Error(`API请求失败 (${resp.status}): ${errText.substring(0, 100)}`);
    }
    
    const data = await resp.json();
    const text = data.choices?.[0]?.message?.content || '生成失败';
    lastSentencesText = text;
    
    // 按行拆分，每句单独加收藏按钮
    const lines = text.split('\n').filter(l => l.trim());
    // 存到临时数组，避免onclick转义问题
    currentGeneratedSentences = lines.map(line => ({
      text: line.trim(),
      pattern: pattern,
      topic: topic
    }));
    
    resultDiv.innerHTML = `
      <div style="background:#f8f9fa;border-radius:8px;padding:16px;font-size:14px">
        ${lines.map((line, i) => `
          <div style="display:flex;align-items:flex-start;gap:8px;padding:8px 0;border-bottom:1px solid #eee;line-height:1.7">
            <button onclick="collectOneSentence(this, ${i})" 
              style="flex-shrink:0;margin-top:2px;background:none;border:none;cursor:pointer;color:#999;padding:2px" title="收藏这句">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>
              </svg>
            </button>
            <div style="flex:1">${line.trim()}</div>
          </div>
        `).join('')}
      </div>
    `;
    document.getElementById('copySentBtn').style.display = 'inline-block';
  } catch(err) {
    resultDiv.innerHTML = `<div style="color:#e53e3e;font-size:13px">生成失败: ${err.message}</div>`;
  } finally {
    btn.disabled = false;
    btn.innerHTML = 'AI 生成例句';
  }
}

function copySentences() {
  if (!lastSentencesText) return;
  navigator.clipboard.writeText(lastSentencesText).then(() => {
    toast('已复制到剪贴板');
  });
}

function savePattern() {
  const pattern = document.getElementById('sentPattern').value.trim();
  if (!pattern) { toast('请先输入句式'); return; }
  if (db.sentencePatterns.includes(pattern)) { toast('这个句式已经在备用库里了'); return; }
  db.sentencePatterns.push(pattern);
  saveDB();
  loadPatternChips();
  toast('句式已保存到备用库');
}

function loadPatternChips() {
  const container = document.getElementById('patternChips');
  if (!container) return;
  if (!db.sentencePatterns || db.sentencePatterns.length === 0) {
    container.innerHTML = '';
    return;
  }
  container.innerHTML = `
    <span style="font-size:11px;color:var(--ink3);align-self:center">常用句式：</span>
    ${db.sentencePatterns.map((p, i) => `
      <span style="display:inline-flex;align-items:center;gap:4px;background:#e8f5e9;padding:4px 10px;border-radius:12px;font-size:12px;cursor:pointer" onclick="document.getElementById('sentPattern').value='${p.replace(/'/g, "\\'")}'">
        ${p}
        <span style="color:#e53e3e;margin-left:2px" onclick="event.stopPropagation(); deletePattern(${i})">×</span>
      </span>
    `).join('')}
  `;
}

function deletePattern(index) {
  db.sentencePatterns.splice(index, 1);
  saveDB();
  loadPatternChips();
}

function collectOneSentence(btn, index) {
  if (!Array.isArray(db.goodSentences)) db.goodSentences = [];
  
  const item = currentGeneratedSentences[index];
  if (!item) { toast('句子数据不存在'); return; }
  
  // 检查是否已经收藏过
  const exists = db.goodSentences.some(s => s.text === item.text);
  if (exists) {
    toast('这句已经收藏过了');
    return;
  }
  
  db.goodSentences.push({
    text: item.text,
    pattern: item.pattern,
    topic: item.topic,
    createdAt: new Date().toISOString()
  });
  saveDB();
  
  // 按钮变成已收藏状态
  btn.innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="#f59e0b" stroke="#f59e0b" stroke-width="2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>';
  btn.style.color = '#f59e0b';
  btn.disabled = true;
  toast('已收藏到好句库');
}

function deleteGoodSentence(index) {
  if (!Array.isArray(db.goodSentences)) return;
  db.goodSentences.splice(index, 1);
  saveDB();
  renderPage(currentPage);
  toast('已删除');
}

    </div>

async function translateNewSentence() {
  const en = document.getElementById('newSentenceEn').value.trim();
  if (!en) {
    toast('请先输入英文句子');
    return;
  }
  toast('AI正在翻译并提取句式...');
  const btn = event.target;
  btn.disabled = true;
  btn.textContent = '处理中...';
  
  try {
    const ai = db.settings.ai;
    const base = ai.base.replace(/\/+$/, '');
    
    // 独立请求，不用全局askAI，避免系统提示词干扰
    const resp = await fetch(base + '/chat/completions', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + ai.key
      },
      body: JSON.stringify({
        model: ai.model,
        messages: [
          { role: 'system', content: '你是严格的翻译工具。用户给你一句英文，你必须准确翻译它，绝对不能自己编造句子，绝对不能翻译其他内容。只翻译用户给你的这一句。' },
          { role: 'user', content: `请翻译下面这句英文，并提取它的句式。

要翻译的英文句子（必须翻译这一句，不准翻译其他任何句子）：
${en}

请严格按下面格式返回，不要加任何其他内容：
翻译：这里写这句英文对应的中文翻译
句式：这里提取这句英文的核心句式，把具体的词换成...省略号` }
        ],
        stream: false,
        temperature: 0.1
      })
    });
    
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    const data = await resp.json();
    const result = data.choices?.[0]?.message?.content?.trim() || '';
    
    // 解析返回结果
    const lines = result.split('\n');
    let zh = '', pattern = '';
    lines.forEach(line => {
      if (line.startsWith('翻译：')) {
        zh = line.replace('翻译：', '').trim();
      } else if (line.startsWith('句式：')) {
        pattern = line.replace('句式：', '').trim();
      }
    });
    
    if (!zh) {
      // 如果没按格式返回，就把整段当翻译
      zh = result;
    }
    
    document.getElementById('newSentenceZh').value = zh;
    if (pattern) {
      document.getElementById('newSentencePattern').value = pattern;
    }
    toast('翻译和句式提取完成，可以修改后保存');
  } catch (e) {
    toast('翻译失败：' + e.message);
  } finally {
    btn.disabled = false;
    btn.textContent = '✨ AI自动翻译';
  }
}

async function sendAiMsg() {
  const input = document.getElementById('aiInputFull');
  const msg = input.value.trim();
  if (!msg) return;
  
  // 隐藏欢迎区域
  const welcome = document.getElementById('aiWelcome');
  if (welcome) welcome.style.display = 'none';
  
  const thread = document.getElementById('aiThreadFull');
  const wrap = document.getElementById('aiWrapFull');
  
  // 添加用户消息
  wrap.insertAdjacentHTML('beforeend', `
    <div class="ai-msg-full user">
      <div class="ava">师</div>
      <div class="bubble">${escapeHtml(msg)}</div>
    </div>
  `);
  
  input.value = '';
  input.style.height = 'auto';
  thread.scrollTop = thread.scrollHeight;
  
  // 创建AI回复占位
  const aiMsgEl = document.createElement('div');
  aiMsgEl.className = 'ai-msg-full assistant';
  aiMsgEl.innerHTML = '<div class="ava">AI</div><div class="bubble" style="color:var(--ink3)">正在思考...</div>';
  wrap.appendChild(aiMsgEl);
  thread.scrollTop = thread.scrollHeight;
  
  if (!aiReady()) {
    // 没配置API，用本地模板回复
    setTimeout(() => {
      const reply = generateLocalReply(msg);
      aiMsgEl.querySelector('.bubble').innerHTML = formatMarkdown(reply) + '<div style="margin-top:10px;padding-top:8px;border-top:1px solid var(--line);font-size:11px;color:var(--ink3)">演示模式 · 配置真实API后获得精准回答</div>';
      thread.scrollTop = thread.scrollHeight;
      
      db.aiChats.push({ question: msg, answer: reply, time: new Date().toISOString() });
      saveDB();
    }, 600);
    return;
  }
  
  // 真实API调用
  try {
    const ai = db.settings.ai;
    const base = ai.base.replace(/\/+$/, '');
    const url = base + '/chat/completions';
    
    const messages = [
      { role: 'system', content: buildSystemPrompt() },
      ...db.aiChats.slice(-6).map(c => [
        { role: 'user', content: c.question },
        { role: 'assistant', content: c.answer }
      ]).flat(),
      { role: 'user', content: msg }
    ];
    
    const headers = { 'Content-Type': 'application/json' };
    if (ai.key) headers['Authorization'] = 'Bearer ' + ai.key;
    
    const resp = await fetch(url, {
      method: 'POST',
      headers,
      body: JSON.stringify({
        model: ai.model,
        messages,
        stream: true,
        temperature: ai.temp || 0.7
      })
    });
    
    if (!resp.ok) {
      const errText = await resp.text();
      throw new Error(`HTTP ${resp.status}: ${errText.slice(0, 200)}`);
    }
    
    // 流式读取
    const reader = resp.body.getReader();
    const decoder = new TextDecoder('utf-8');
    let buf = '';
    let fullText = '';
    
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      
      buf += decoder.decode(value, { stream: true });
      const lines = buf.split('\n');
      buf = lines.pop();
      
      for (const line of lines) {
        const trimmed = line.trim();
        if (!trimmed.startsWith('data:')) continue;
        const data = trimmed.slice(5).trim();
        if (data === '[DONE]') continue;
        
        try {
          const json = JSON.parse(data);
          const delta = json.choices?.[0]?.delta?.content || '';
          if (delta) {
            fullText += delta;
            aiMsgEl.querySelector('.bubble').innerHTML = formatMarkdown(fullText);
            thread.scrollTop = thread.scrollHeight;
          }
        } catch(e) {}
      }
    }
    
    if (!fullText) {
      aiMsgEl.querySelector('.bubble').textContent = '（空回复）';
    }
    
    // 保存对话
    db.aiChats.push({ question: msg, answer: fullText, time: new Date().toISOString() });
    if (db.aiChats.length > 50) db.aiChats = db.aiChats.slice(-50);
    saveDB();
    
  } catch (err) {
    console.error('AI error:', err);
    let errMsg = '调用失败：' + err.message;
    if (err.message.includes('401')) errMsg = 'API Key 无效，请检查设置';
    else if (err.message.includes('404')) errMsg = '接口地址或模型名不对';
    else if (err.message.includes('Failed to fetch')) errMsg = '网络错误或跨域限制，可试试 DeepSeek/智谱 等支持跨域的服务';
    
    aiMsgEl.querySelector('.bubble').innerHTML = `<span style="color:var(--red)">${errMsg}</span><br><span style="font-size:12px;color:var(--ink3)">可点击右上角设置检查配置，或继续使用本地演示模式</span>`;
  }
}

function escapeHtml(s) {
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

// Markdown 格式化
function formatMarkdown(text) {
  if (!text) return '';
  // 先把 markdown 表格转成 HTML（在 escapeHtml 之前按行处理）
  var lines = text.split('\n');
  var out = [];
  var i = 0;
  while (i < lines.length) {
    var line = lines[i];
    // 检测表格：本行含 |，下一行是分隔线 |---|---|
    if (/^\s*\|.*\|\s*$/.test(line) && i+1 < lines.length && /^\s*\|[\s:|-]+\|\s*$/.test(lines[i+1])) {
      var header = line.trim();
      i += 2; // 跳过分隔线
      var rows = [];
      while (i < lines.length && /^\s*\|.*\|\s*$/.test(lines[i])) {
        rows.push(lines[i].trim());
        i++;
      }
      out.push('__TABLE_START__' + header + '\n' + rows.join('\n') + '__TABLE_END__');
      continue;
    }
    out.push(line);
    i++;
  }
  text = out.join('\n');

  let html = escapeHtml(text);

  // 还原表格占位符为 HTML 表格
  html = html.replace(/__TABLE_START__([\s\S]*?)__TABLE_END__/g, function(m, body) {
    var tableLines = body.split('\n');
    var hdrCells = tableLines[0].split('|').slice(1, -1).map(function(c){return c.trim();});
    var rows = tableLines.slice(1).map(function(r){
      return r.split('|').slice(1, -1).map(function(c){return c.trim();});
    });
    var h = '<table style="border-collapse:collapse;width:100%;margin:10px 0;font-size:14px">';
    h += '<tr>' + hdrCells.map(function(c){
      return '<th style="background:#f1f5f9;border:1px solid #cbd5e1;padding:8px 10px;text-align:left;font-weight:700;color:#0f172a">' + c + '</th>';
    }).join('') + '</tr>';
    rows.forEach(function(r, idx){
      h += '<tr' + (idx%2 ? ' style="background:#f8fafc"' : '') + '>' + r.map(function(c){
        return '<td style="border:1px solid #cbd5e1;padding:8px 10px;vertical-align:top">' + c + '</td>';
      }).join('') + '</tr>';
    });
    h += '</table>';
    return h;
  });

  // 标题 ### ## #
  html = html.replace(/^### (.+)$/gm, '<div style="font-size:14px;font-weight:700;margin:10px 0 4px">$1</div>');
  html = html.replace(/^## (.+)$/gm, '<div style="font-size:15px;font-weight:700;margin:12px 0 6px;color:#1e293b">$1</div>');
  html = html.replace(/^# (.+)$/gm, '<div style="font-size:16px;font-weight:700;margin:14px 0 8px;color:#0f172a">$1</div>');
  // 粗体
  html = html.replace(/\*\*(.+?)\*\*/g, '<strong style="color:#0f172a">$1</strong>');
  // 行内代码
  html = html.replace(/`([^`]+)`/g, '<code style="background:#f1f5f9;padding:1px 5px;border-radius:4px;font-size:12px">$1</code>');
  // 无序列表
  html = html.replace(/^[-*] (.+)$/gm, '<div style="padding-left:16px;text-indent:-10px">• $1</div>');
  // 有序列表
  html = html.replace(/^\d+\. (.+)$/gm, '<div style="padding-left:16px;text-indent:-10px">☑ $1</div>');
  // 分隔线
  html = html.replace(/^---+$/gm, '<hr style="border:none;border-top:1px solid #e2e8f0;margin:10px 0">');
  // 空行变段落间距
  html = html.replace(/\n\n+/g, '<div style="height:8px"></div>');
  // 单换行
  html = html.replace(/\n/g, '<br>');
  return html;
}

function bindPageEvents(page) {
  // 备课筛选
  if (page === 'lesson') {
    document.querySelectorAll('#lessonFilter button').forEach(btn => {
      btn.onclick = () => {
        document.querySelectorAll('#lessonFilter button').forEach(b => b.classList.remove('on'));
        btn.classList.add('on');
        const filter = btn.dataset.filter;
        document.querySelectorAll('#lessonList .lesson-card').forEach(card => {
          card.style.display = (filter === 'all' || card.dataset.class === filter) ? '' : 'none';
        });
      };
    });
  }
  
  // 反思笔记筛选
  if (page === 'reflection') {
    document.querySelectorAll('#reflectionFilter button').forEach(btn => {
      btn.onclick = () => {
        document.querySelectorAll('#reflectionFilter button').forEach(b => b.classList.remove('on'));
        btn.classList.add('on');
        const filter = btn.dataset.filter;
        document.querySelectorAll('#reflectionList .reflection-card').forEach(card => {
          card.style.display = (filter === 'all' || card.dataset.type === filter) ? '' : 'none';
        });
      };
    });
  }
  // 错题筛选：标签按钮已通过 inline onclick 设置 window.errFilterTag 并调用 renderPage('errors')
  // 重新渲染过滤，高亮也由模板按 window.errFilterTag 生成。这里不能再用 btn.onclick 覆盖——
  // 标签按钮上没有 data-type 属性，覆盖后 filter 恒为 undefined，会把所有错题卡片隐藏。
  
  // 知识点筛选
  if (page === 'knowledge') {
    document.querySelectorAll('#kpFilter button').forEach(btn => {
      btn.onclick = () => {
        document.querySelectorAll('#kpFilter button').forEach(b => b.classList.remove('on'));
        btn.classList.add('on');
        const filter = btn.dataset.cat;
        document.querySelectorAll('#kpList .kp-card').forEach(card => {
          card.style.display = (filter === 'all' || card.dataset.cat === filter) ? '' : 'none';
        });
      };
    });
  }
  
  // AI输入回车发送
  if (page === 'ai' || document.getElementById('app').classList.contains('with-rail')) {
    const aiInput = document.getElementById('aiInput');
    if (aiInput) {
      aiInput.onkeydown = (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          sendAiMsg();
        }
      };
      // 自动调整高度
      aiInput.oninput = () => {
        aiInput.style.height = 'auto';
        aiInput.style.height = Math.min(aiInput.scrollHeight, 120) + 'px';
      };
    }
  }
}

    '</div>' +

      '<div id="essayFsLeft" style="overflow-y:auto;background:#fff;border-radius:14px;padding:20px;box-shadow:0 1px 3px rgba(0,0,0,.06);font-size:' + fsSize + 'px;line-height:1.8">' + left + '</div>' +
      '<div id="essayFsRight" style="overflow-y:auto;background:#fff;border-radius:14px;padding:20px;box-shadow:0 1px 3px rgba(0,0,0,.06);font-size:' + fsSize + 'px;line-height:1.8">' + right + '</div>' +
    '</div>';
  document.body.appendChild(ov);

// ===== 作文板：复习模式,单栏/左右/上下,选中文本加[]遮盖或批注 =====
var essayBoardState = { layout: 1, fs: 16, anns: [], source: 'essays' };
function essayBoard(id, source) {
  source = source || 'essays';
  const arr = source === 'resources' ? (db.resources||[]) : (db.essays||[]);
  const e = arr.find(x => x.id === id);
  if (!e) return;
  if (!Array.isArray(e.annotations)) e.annotations = [];
  var autoLayout = (source==='resources' && e.leftContent && e.leftContent.trim()) ? 1 : 0;
  essayBoardState = { layout: autoLayout, fs: 32, anns: e.annotations, essayId: id, source: source };
  var ov = document.getElementById('essayBoardOv');
  if (ov) ov.remove();
  ov = document.createElement('div');
  ov.id = 'essayBoardOv';
  ov.style.cssText = 'position:fixed;inset:0;background:#f1f5f9;z-index:9999;display:flex;flex-direction:column';
  document.body.appendChild(ov);
  renderEssayBoard(e);
}
function ebSection(label, content, isModel) {
  return '<div class="essay-section" style="margin-top:0"><div class="essay-section-label">' + label + '</div><div class="essay-section-content' + (isModel ? ' essay-model' : '') + ' eb-block">' + content + '</div></div>';
}
function ebGet() {
  var arr = essayBoardState.source === 'resources' ? (db.resources||[]) : (db.essays||[]);
  return arr.find(x=>x.id===essayBoardState.essayId);
}
function renderEssayBoard(e) {
  var ov = document.getElementById('essayBoardOv');
  var layoutName = ['单栏','左右双栏','上下双栏'][essayBoardState.layout];
  var gridStyle = '';
  if (essayBoardState.layout === 0) gridStyle = 'grid-template-columns:1fr;overflow-y:auto';
  else if (essayBoardState.layout === 1) gridStyle = 'grid-template-columns:1fr 1.4fr;min-height:0';
  else gridStyle = 'grid-template-rows:1fr 1.4fr;min-height:0;overflow-y:auto';

  var leftParts = '';
  var rightParts = '';
  if (essayBoardState.source === 'resources') {
    // 资料库: 有左栏内容则双栏, 否则单栏全屏
    var lc = e.leftContent || '';
    var rc = e.rightContent || e.content || '';
    if (lc.trim()) {
      leftParts = ebSection('📌 题目/导语', formatMarkdown(lc));
      rightParts = ebSection('📄 正文', formatMarkdown(rc), true);
    } else {
      leftParts = '';
      rightParts = ebSection('📄 ' + (e.title||'资料'), formatMarkdown(rc), true);
    }
  } else {
    if (e.topic) leftParts += ebSection('📌 题目要求', formatMarkdown(e.topic));
    if (!leftParts) leftParts = '<div style="color:#999;padding:20px">左侧暂无内容</div>';
    if (e.analysis) rightParts += ebSection('🔍 审题分析', formatMarkdown(e.analysis));
    if (e.vocabulary) rightParts += ebSection('📚 词库与句式', formatMarkdown(e.vocabulary));
    if (e.modelEssay) rightParts += ebSection('⭐ 高分范文', formatMarkdown(e.modelEssay), true);
  }

  ov.innerHTML =
    '<div style="display:flex;align-items:center;gap:10px;padding:14px 20px;background:#1e293b;color:#fff;flex-wrap:wrap;flex-shrink:0">' +
      '<h3 style="margin:0;font-size:16px">' + (essayBoardState.source==='resources' ? '📚 资料板 · ' : '📋 作文板 · ') + escapeHtml(e.title||'未命名') + '</h3>' +
      '<button onclick="ebAddMark()" title="先在正文选中文字,再点此按钮遮盖" style="padding:6px 12px;border-radius:8px;border:none;background:#f59e0b;color:#fff;cursor:pointer;font-size:13px">🙈 遮盖</button>' +
      '<button onclick="ebCoverBold()" title="一键把所有加粗的英文单词包成草地遮盖" style="padding:6px 12px;border-radius:8px;border:none;background:#16a34a;color:#fff;cursor:pointer;font-size:13px">🌿 全遮加粗</button>' +
      '<button onclick="ebAddComment()" title="先在正文选中文字,再点此按钮加批注" style="padding:6px 12px;border-radius:8px;border:none;background:#10b981;color:#fff;cursor:pointer;font-size:13px">💬 批注</button>' +
      '<button onmousedown="event.preventDefault()" onclick="ebAddFmt(&quot;bold&quot;)" title="选中文字加粗" style="padding:6px 12px;border-radius:8px;border:none;background:#334155;color:#fff;cursor:pointer;font-size:13px;font-weight:800">B</button>' +
      '<button onmousedown="event.preventDefault()" onclick="ebAddFmt(&quot;underline&quot;)" title="选中文字加下划线" style="padding:6px 12px;border-radius:8px;border:none;background:#334155;color:#fff;cursor:pointer;font-size:13px;text-decoration:underline">U</button>' +
      '<button onmousedown="event.preventDefault()" onclick="ebAddFmt(&quot;red&quot;)" title="选中文字标红" style="padding:6px 12px;border-radius:8px;border:none;background:#dc2626;color:#fff;cursor:pointer;font-size:13px;font-weight:800">R</button>' +
      '<button onclick="ebClearAnns()" title="清除所有遮盖和批注(右键单个标注也可删除)" style="padding:6px 12px;border-radius:8px;border:none;background:#64748b;color:#fff;cursor:pointer;font-size:13px">🗑 清除标注</button>' +
      '<button onclick="ebUndo()" title="撤销上一条标注" style="padding:6px 12px;border-radius:8px;border:none;background:#64748b;color:#fff;cursor:pointer;font-size:13px">↩️ 撤销</button>' +
      '<div style="flex:1"></div>' +
      '<button onclick="ebLayout()" style="padding:6px 14px;border-radius:8px;border:none;background:#7c3aed;color:#fff;cursor:pointer">⛶ ' + layoutName + '</button>' +
      '<button onclick="ebFont(-1)" style="padding:6px 12px;border-radius:8px;border:none;background:rgba(255,255,255,.15);color:#fff;cursor:pointer">A−</button>' +
      '<span id="ebFs" style="font-size:13px;min-width:40px;text-align:center">' + essayBoardState.fs + 'px</span>' +
      '<button onclick="ebFont(1)" style="padding:6px 12px;border-radius:8px;border:none;background:rgba(255,255,255,.15);color:#fff;cursor:pointer">A+</button>' +
      '<button onclick="ebExit()" style="padding:6px 16px;border-radius:8px;border:none;background:#dc2626;color:#fff;cursor:pointer">✕ 退出</button>' +
    '</div>' +
    '<div style="flex:1;display:' + (essayBoardState.layout===0?'block':'grid') + ';' + gridStyle + ';gap:16px;padding:20px;box-sizing:border-box">' +
      (essayBoardState.layout===0
        ? '<div class="eb-panel" style="background:#fff;border-radius:14px;padding:24px;overflow-y:auto;font-size:' + essayBoardState.fs + 'px;line-height:1.8;max-width:1000px;margin:0 auto" onmouseup="ebSelCheck()">' + leftParts + (rightParts && rightParts.indexOf('左侧暂无内容')<0 ? rightParts : '') + '</div>'
        : '<div class="eb-panel" style="background:#fff;border-radius:14px;padding:20px;overflow-y:auto;font-size:' + essayBoardState.fs + 'px;line-height:1.8" onmouseup="ebSelCheck()">' + leftParts + '</div>' +
          '<div class="eb-panel" style="background:#fff;border-radius:14px;padding:20px;overflow-y:auto;font-size:' + essayBoardState.fs + 'px;line-height:1.8" onmouseup="ebSelCheck()">' + rightParts + '</div>') +
    '</div>' +
    '<div id="ebSelBar" onmousedown="event.preventDefault()" style="display:none;position:fixed;left:20px;top:50%;transform:translateY(-50%);z-index:10000;background:#1e293b;color:#fff;padding:10px 8px;border-radius:14px;box-shadow:0 4px 20px rgba(0,0,0,.4);gap:6px;flex-direction:column">' +
      '<button onclick="ebAddMark()" style="padding:5px 10px;border:none;border-radius:6px;background:#f59e0b;color:#fff;cursor:pointer;font-size:12px">🙈 []遮盖</button>' +
      '<button onclick="ebAddFmt(\"bold\")" style="padding:5px 10px;border:none;border-radius:6px;background:#334155;color:#fff;cursor:pointer;font-size:12px;font-weight:800">B</button>' +
      '<button onclick="ebAddFmt(\"underline\")" style="padding:5px 10px;border:none;border-radius:6px;background:#334155;color:#fff;cursor:pointer;font-size:12px;text-decoration:underline">U</button>' +
      '<button onclick="ebAddComment()" style="padding:5px 10px;border:none;border-radius:6px;background:#10b981;color:#fff;cursor:pointer;font-size:12px">💬 批注</button>' +
      '<button onclick="ebClearSel()" style="padding:5px 10px;border:none;border-radius:6px;background:rgba(255,255,255,.15);color:#fff;cursor:pointer;font-size:12px">✕ 取消</button>' +
    '</div>';
  setTimeout(ebApplyAnns, 50);
}
function ebLayout() {
  essayBoardState.layout = (essayBoardState.layout + 1) % 3;
  var e = ebGet();
  renderEssayBoard(e);
}
function ebFont(d) {
  essayBoardState.fs = Math.max(12, Math.min(32, essayBoardState.fs + d));
  var zoom = essayBoardState.fs / 16;
  document.querySelectorAll('.eb-panel').forEach(function(p){ p.style.zoom = zoom; });
  document.getElementById('ebFs').textContent = essayBoardState.fs+'px';
}
function ebCoverBold() {
  var e = ebGet();
  if (!e) return;
  var bolds = document.querySelectorAll('.eb-panel strong, .eb-panel b');
  var count = 0;
  bolds.forEach(function(b){
    var txt = (b.textContent||'').trim();
    if (!txt || !/[A-Za-z]{3,}/.test(txt)) return;
    if (b.closest('.eb-mark') || b.closest('.eb-comment')) return;
    var idx = e.annotations.length;
    e.annotations.push({ type:'mark', text: txt, note: '' });
    var span = document.createElement('span');
    span.className = 'eb-mark';
    span.dataset.idx = idx;
    span.style.cssText = 'background:linear-gradient(0deg,#bbf7d0 0%,#4ade80 60%,#16a34a 100%);color:transparent;padding:4px 8px;border-radius:4px;cursor:pointer;user-select:none;clip-path:polygon(0 30%,8% 0,15% 30%,22% 0,30% 30%,38% 0,45% 30%,52% 0,60% 30%,68% 0,75% 30%,82% 0,90% 30%,95% 0,100% 30%,100% 100%,0 100%)';
    span.onclick = function(ev){
      ev.stopPropagation();
      var grass = 'background:linear-gradient(0deg,#bbf7d0 0%,#4ade80 60%,#16a34a 100%);color:transparent;padding:4px 8px;border-radius:4px;cursor:pointer;user-select:none;clip-path:polygon(0 30%,8% 0,15% 30%,22% 0,30% 30%,38% 0,45% 30%,52% 0,60% 30%,68% 0,75% 30%,82% 0,90% 30%,95% 0,100% 30%,100% 100%,0 100%)';
      var show = 'background:#dcfce7;color:#14532d;padding:2px 6px;border-radius:4px;cursor:pointer;clip-path:none;user-select:auto';
      if (this.dataset.shown === '1') { this.dataset.shown=''; this.style.cssText = grass; }
      else { this.dataset.shown='1'; this.style.cssText = show; }
    };
    b.parentNode.insertBefore(span, b);
    span.appendChild(b);
    count++;
  });
  saveDB();
  toast('已把 ' + count + ' 处加粗英文包成草地遮盖');
}
function ebClearAnns() {
  if (!confirm('清除本篇作文板所有遮盖和批注？')) return;
  var e = ebGet();
  e.annotations = [];
  saveDB();
  renderEssayBoard(e);
  toast('已清除全部标注');
}
function ebRemoveAnn(el) {
  var e = ebGet();
  var idx = parseInt(el.dataset.idx);
  e.annotations.splice(idx, 1);
  saveDB();
  renderEssayBoard(e);
}
function ebExit() { var o=document.getElementById('essayBoardOv'); if(o) o.remove(); }
var ebSavedRange = null;
function ebSelCheck() {
  var sel = window.getSelection();
  var txt = sel.toString().trim();
  var bar = document.getElementById('ebSelBar');
  if (!txt || txt.length < 2) { bar.style.display='none'; return; }
  try { ebSavedRange = sel.getRangeAt(0).cloneRange(); } catch(e){}
  bar.style.display = 'flex';
}
function ebClearSel() { window.getSelection().removeAllRanges(); document.getElementById('ebSelBar').style.display='none'; }
function ebAddMark() {
  var sel = window.getSelection();
  var txt = sel.toString().trim();
  if (!txt && ebSavedRange) {
    sel.removeAllRanges(); sel.addRange(ebSavedRange);
    txt = sel.toString().trim();
  }
  if (!txt) { toast('请先在正文选中要遮盖的文字'); return; }
  var e = ebGet();
  var idx = e.annotations.length;
  e.annotations.push({ type:'mark', text: txt, note: '' });
  saveDB();
  ebWrapSelection(sel, 'eb-mark', 'data-idx="'+idx+'" style="background:linear-gradient(0deg,#bbf7d0 0%,#4ade80 60%,#16a34a 100%);color:transparent;padding:10px 12px 4px;border-radius:2px 2px 8px 8px;cursor:pointer;user-select:none;clip-path:polygon(0 30%,8% 0,15% 30%,22% 0,30% 30%,38% 0,45% 30%,52% 0,60% 30%,68% 0,75% 30%,82% 0,90% 30%,95% 0,100% 30%,100% 100%,0 100%)" title="点击显示"');
  toast('已标记为遮盖,点击该段切换显示');
}
function ebAddComment() {
  var sel = window.getSelection();
  var txt = sel.toString().trim();
  if (!txt && ebSavedRange) {
    sel.removeAllRanges(); sel.addRange(ebSavedRange);
    txt = sel.toString().trim();
  }
  if (!txt) { toast('请先在正文选中要加批注的文字'); return; }
  var note = prompt('给 "' + txt.slice(0,30) + (txt.length>30?'…':'') + '" 加什么批注？');
  if (note === null) return;
  var e = ebGet();
  var idx = e.annotations.length;
  e.annotations.push({ type:'comment', text: txt, note: note });
  saveDB();
  ebWrapSelection(sel, 'eb-comment', 'data-idx="'+idx+'" style="background:#fef9c3;padding:1px 4px;border-radius:3px;cursor:pointer;border-bottom:2px solid #eab308" title="'+note.replace(/"/g,'&quot;')+'"');
  toast('批注已添加');
}
function ebAddFmt(type) {
  var sel = window.getSelection();
  var txt = sel.toString().trim();
  if (!txt && ebSavedRange) {
    // restore saved selection
    sel.removeAllRanges();
    sel.addRange(ebSavedRange);
    txt = sel.toString().trim();
  }
  if (!txt) { toast('请先在正文选中文字'); return; }
  var e = ebGet();
  var idx = e.annotations.length;
  e.annotations.push({ type: type, text: txt, note: '' });
  saveDB();
  var style;
  if (type === 'bold') style = 'font-weight:800;color:#0f172a';
  else if (type === 'red') style = 'color:#dc2626;font-weight:600';
  else style = 'text-decoration:underline;text-decoration-color:#dc2626;text-decoration-thickness:2px;text-underline-offset:3px';
  ebWrapSelection(sel, 'eb-'+type, 'data-idx="'+idx+'" style="'+style+'"');
  toast(type==='bold'?'已加粗':'已加下划线');
}
function ebUndo() {
  var e = ebGet();
  if (!e.annotations || !e.annotations.length) { toast('没有可撤销的标注'); return; }
  e.annotations.pop();
  saveDB();
  renderEssayBoard(e);
  toast('已撤销上一条');
}
function ebWrapSelection(sel, cls, attrs) {
  if (sel.rangeCount === 0) return;
  var range = sel.getRangeAt(0);
  var span = document.createElement('span');
  span.className = cls;
  span.setAttribute('data-idx', attrs.match(/data-idx="(\d+)"/)[1]);
  // Preserve scroll positions
  var panels = document.querySelectorAll('.eb-panel');
  var scrolls = [];
  panels.forEach(function(p){ scrolls.push(p.scrollTop); });
  try {
    range.surroundContents(span);
  } catch(err) {
    // selection crosses element boundaries: extract+insert
    span.appendChild(range.extractContents());
    range.insertNode(span);
  }
  // Apply style attrs
  span.style.cssText = attrs.split('style="')[1].split('"')[0];
  // Apply title (hover tooltip)
  var tm = attrs.match(/title="([^"]*)"/);
  if (tm) span.title = tm[1];
  // Bind click
  if (cls === 'eb-mark') {
    span.onclick = function(ev){
      ev.stopPropagation();
      var grass = 'background:linear-gradient(0deg,#bbf7d0 0%,#4ade80 60%,#16a34a 100%);color:transparent;padding:10px 12px 4px;border-radius:2px 2px 8px 8px;cursor:pointer;user-select:none;clip-path:polygon(0 30%,8% 0,15% 30%,22% 0,30% 30%,38% 0,45% 30%,52% 0,60% 30%,68% 0,75% 30%,82% 0,90% 30%,95% 0,100% 30%,100% 100%,0 100%)';
      var show = 'background:#dcfce7;color:#14532d;padding:2px 6px;border-radius:4px;cursor:pointer;clip-path:none;user-select:auto';
      if (this.dataset.shown === '1') { this.dataset.shown=''; this.style.cssText = grass; }
      else { this.dataset.shown='1'; this.style.cssText = show; }
    };
  } else if (cls === 'eb-comment') {
    span.onclick = function(){
      var e = ebGet();
      var note = (e.annotations[parseInt(this.dataset.idx)]||{}).note || '';
      alert('💬 批注：' + note);
    };
    span.oncontextmenu = function(ev){ ev.preventDefault(); if(confirm('删除这条标注？')) ebRemoveAnn(this); };
  } else {
    // bold / underline: right-click to remove
    span.oncontextmenu = function(ev){ ev.preventDefault(); if(confirm('删除这条格式标注？')) ebRemoveAnn(this); };
  }
  sel.removeAllRanges();
  document.getElementById('ebSelBar').style.display='none';
  // Restore scroll
  panels.forEach(function(p,i){ p.scrollTop = scrolls[i]; });
}
function ebApplyAnns() {
  var e = ebGet();
  var panels = document.querySelectorAll('.eb-panel');
  panels.forEach(function(p){
    var html = p.innerHTML;
    (e.annotations||[]).forEach(function(a, idx){
      // Skip if already wrapped (in-place wrap from ebWrapSelection)
      if (html.indexOf('data-idx="'+idx+'"') !== -1) return;
      var safeText = a.text
        .replace(/[.*+?^${}()|[\]\\]/g, '\\$&')
        .split(/\\s+/)
        .join('(?:<[^>]+>)*\\s*(?:<[^>]+>)*');
      var re = new RegExp('(' + safeText + ')', 'g');
      var cls = 'eb-' + a.type;
      var style = '';
      if (a.type === 'mark') style = 'background:linear-gradient(0deg,#bbf7d0 0%,#4ade80 60%,#16a34a 100%);color:transparent;padding:10px 12px 4px;border-radius:2px 2px 8px 8px;cursor:pointer;user-select:none;clip-path:polygon(0 30%,8% 0,15% 30%,22% 0,30% 30%,38% 0,45% 30%,52% 0,60% 30%,68% 0,75% 30%,82% 0,90% 30%,95% 0,100% 30%,100% 100%,0 100%)';
      else if (a.type === 'comment') style = 'background:#fef9c3;padding:1px 4px;border-radius:3px;cursor:pointer;border-bottom:2px solid #eab308';
      else if (a.type === 'bold') style = 'font-weight:800;color:#0f172a';
      else if (a.type === 'red') style = 'color:#dc2626;font-weight:600';
      else if (a.type === 'underline') style = 'text-decoration:underline;text-decoration-color:#dc2626;text-decoration-thickness:2px;text-underline-offset:3px';
      var attrs = 'data-idx="'+idx+'" style="'+style+'"' + (a.type==='comment' ? ' title="'+String(a.note||'').replace(/"/g,'&quot;')+'"' : '') + (a.type==='mark' ? ' title="点击显示"' : '');
      html = html.replace(re, '<span class="'+cls+'" '+attrs+'>$1</span>');
    });
    p.innerHTML = html;
  });
  // Right-click to remove single annotation
  document.querySelectorAll('.eb-mark, .eb-comment, .eb-bold, .eb-underline').forEach(function(el){
    el.oncontextmenu = function(ev){ ev.preventDefault(); if(confirm('删除这条标注？')) ebRemoveAnn(this); };
  });
  // Bind click toggles
  var grassStyle = 'background:linear-gradient(0deg,#bbf7d0 0%,#4ade80 60%,#16a34a 100%);color:transparent;padding:10px 12px 4px;border-radius:2px 2px 8px 8px;cursor:pointer;user-select:none;clip-path:polygon(0 30%,8% 0,15% 30%,22% 0,30% 30%,38% 0,45% 30%,52% 0,60% 30%,68% 0,75% 30%,82% 0,90% 30%,95% 0,100% 30%,100% 100%,0 100%)';
  var showStyle = 'background:#dcfce7;color:#14532d;padding:2px 6px;border-radius:4px;cursor:pointer;clip-path:none;user-select:auto';
  document.querySelectorAll('.eb-mark').forEach(function(el){
    el.onclick = function(ev){
      ev.stopPropagation();
      if (this.dataset.shown === '1') {
        this.dataset.shown = '';
        this.style.cssText = grassStyle;
      } else {
        this.dataset.shown = '1';
        this.style.cssText = showStyle;
      }
    };
  });
  document.querySelectorAll('.eb-comment').forEach(function(el){
    el.onclick = function(){
      var note = (e.annotations[parseInt(this.dataset.idx)]||{}).note || '';
      alert('💬 批注：' + note);
    };
  });
}

function deleteEssay(id) {
  if (!confirm('确定要删除这篇作文吗？')) return;
  db.essays = db.essays.filter(e => e.id !== id);
  saveDB();
  renderPage('essays');
  toast('已删除');
}

// AI生成作文模态框
function openEssayAIModal() {
  const bodyHTML = `

async function generateEssayAI() {
  const type = document.getElementById('essayType').value;
  const topic = document.getElementById('essayTopic').value.trim();
  const tagsInput = document.getElementById('essayTags').value.trim();
  const wordCount = document.getElementById('essayWordCount').value.trim() || '80词左右';
  const tags = tagsInput ? tagsInput.split(/[,，]/).map(t => t.trim()).filter(t => t) : [];
  
  const saveBtn = document.getElementById('modalSaveBtn');
  saveBtn.disabled = true;
  saveBtn.innerHTML = '<span style="display:inline-block;width:12px;height:12px;border:2px solid currentColor;border-top-color:transparent;border-radius:50%;animation:spin .8s linear infinite"></span> AI生成中...';
  
  try {
    const ai = db.settings.ai;
    const base = ai.base.replace(/\/+$/, '');
    
    const prompt = `我是高中英语老师，请根据以下${type}题目要求，生成完整的写作教学素材，严格按照以下三个部分输出：

【题目要求】
${topic}

【字数要求】${wordCount}

请按以下格式输出（每部分单独成段，不要用markdown符号）：

一、审题分析
（分析体裁、人称、时态、要点、交际目的、语气等，中文写）

二、核心词库与高分句式
（列出5-8个核心词汇搭配（词块），3-5个高分句式模板，每个配中文说明，用英文写短语+中文注释）

三、高分范文
（一篇符合高考水平的范文，${wordCount}，英文写）

要求：范文要使用高级词汇和复杂句式（倒装、强调、非谓语、名词性从句等），表达地道自然。`;

    const messages = [
      { role: 'system', content: buildSystemPrompt() },
      { role: 'user', content: prompt }
    ];
    
    const headers = { 'Content-Type': 'application/json' };
    if (ai.key) headers['Authorization'] = 'Bearer ' + ai.key;
    
    const resp = await fetch(base + '/chat/completions', {
      method: 'POST',
      headers,
      body: JSON.stringify({
        model: ai.model,
        messages,
        stream: false,
        temperature: ai.temp || 0.7
      })
    });
    
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    
    const data = await resp.json();
    let result = data.choices?.[0]?.message?.content || '';
    
    // 解析三个部分
    let analysis = '', vocabulary = '', modelEssay = '';
    
    // 尝试匹配"一、审题分析"到"二、"之间
    const m1 = result.match(/一[、．.]\s*审题分析([\s\S]*?)(?=二[、．.]|$)/);
    const m2 = result.match(/二[、．.]\s*核心词库[\s\S]*?([\s\S]*?)(?=三[、．.]|$)/);
    const m3 = result.match(/三[、．.]\s*高分范文([\s\S]*?)$/);
    
    if (m1) analysis = m1[1].trim();
    if (m2) vocabulary = m2[1].trim();
    if (m3) modelEssay = m3[1].trim();
    
    // 如果匹配失败，就整体作为范文
    if (!analysis && !modelEssay) {
      modelEssay = result;
    }
    
    // 生成标题
    const title = topic.length > 30 ? topic.slice(0, 30) + '...' : topic;
    
    // 保存到数据库
    const essay = {
      id: uid(),
      title: title,
      type: type,
      topic: topic,
      requirements: topic,
      tags: tags,
      analysis: analysis,
      vocabulary: vocabulary,
      modelEssay: modelEssay,
      createdAt: new Date().toISOString(),
      updatedAt: new Date().toISOString()
    };
    
    db.essays.unshift(essay);
    saveDB();
    closeModal();
    essayFilterTag = '';
    essaySearchKeyword = '';
    renderPage('essays');
    toast('AI作文素材已生成并保存，共 ' + db.essays.length + ' 篇');
    
  } catch(err) {
    toast('AI生成失败：' + err.message);
    saveBtn.disabled = false;
    saveBtn.innerHTML = '生成并保存';
  }
}

// AI辅助填充单个板块
async function aiFillEssaySection(section) {
  const topic = document.getElementById('emTopic').value.trim() || document.getElementById('emTitle').value.trim();
  const type = document.getElementById('emType') ? document.getElementById('emType').value : '应用文';
  
  if (!topic) { toast('请先填写标题或话题要求'); return; }
  
  const btn = event.target;
  btn.classList.add('loading');
  const originalText = btn.textContent;
  btn.textContent = '✨ 生成中...';
  
  try {
    const ai = db.settings.ai;
    const base = ai.base.replace(/\/+$/, '');
    
    let prompt = '';
    let targetId = '';
    
    if (section === 'analysis') {
      prompt = `我是高中英语老师，请为以下${type}作文题目做审题分析，包括：体裁、人称、时态、内容要点、交际目的、语气要求、注意事项。用中文写，条理清晰。\n\n题目：${topic}`;
      targetId = 'emAnalysis';
    } else if (section === 'vocabulary') {
      prompt = `我是高中英语老师，请为以下${type}作文题目推荐核心词库和高分句式。列出5-8个核心词块（collocation），3-5个高分句式模板（含倒装、强调、非谓语等），每个配中文注释。用英文写短语+中文说明。\n\n题目：${topic}`;
      targetId = 'emVocabulary';
    } else if (section === 'modelEssay') {
      prompt = `我是高中英语老师，请根据以下${type}题目写一篇高考水平的高分范文，80词左右（应用文）或150词左右（读后续写），要求使用高级词汇和复杂句式，表达地道自然。只输出范文正文，不要其他说明。\n\n题目：${topic}`;
      targetId = 'emModelEssay';
    }
    
    const messages = [
      { role: 'system', content: buildSystemPrompt() },
      { role: 'user', content: prompt }
    ];
    
    const headers = { 'Content-Type': 'application/json' };
    if (ai.key) headers['Authorization'] = 'Bearer ' + ai.key;
    
    const resp = await fetch(base + '/chat/completions', {
      method: 'POST',
      headers,
      body: JSON.stringify({
        model: ai.model,
        messages,
        stream: false,
        temperature: ai.temp || 0.7
      })
    });
    
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    
    const data = await resp.json();
    let result = data.choices?.[0]?.message?.content || '';
    
    const targetEl = document.getElementById(targetId);
    if (targetEl) {
      if (targetEl.value.trim()) {
        targetEl.value = targetEl.value + '\n\n' + result.trim();
      } else {
        targetEl.value = result.trim();
      }
    }
    
    toast('AI内容已填充');
    
  } catch(err) {
    toast('AI填充失败：' + err.message);
  } finally {
    btn.classList.remove('loading');
    btn.textContent = originalText;
  }
}

let flashcardFlipped = false;
let flashcardMode = 'cn2en';
let selectedSentenceIndices = []; // 用户选中要复习的句子索引
let selectedTag = '全部';

function openFlashcardMode() {
  if (!db.goodSentences || db.goodSentences.length === 0) {
    toast('还没有收藏好句，先去AI造句收藏几句吧');
    return;
  }
  selectedTag = '全部';
  renderTagBar();
  renderSentenceList();
  document.getElementById('flashcardSelectOverlay').style.display = 'flex';
}

function renderTagBar() {
  var tags = ['全部'];
  db.goodSentences.forEach(function(s){
    var t = s.pattern || '未分类';
    if (tags.indexOf(t) === -1) tags.push(t);
  });
  var bar = document.getElementById('tagFilterBar');
  bar.innerHTML = '<select id="tagSelect" onchange="filterByTag(this.value)" style="padding:8px 14px;border-radius:10px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.1);color:#fff;font-size:14px;cursor:pointer;max-width:280px">'+
    tags.map(function(t){
      return '<option value="'+t+'" '+(t===selectedTag?'selected':'')+' style="color:#000">'+t+'</option>';
    }).join('')+'</select>';
}

function filterByTag(t) {
  selectedTag = t;
  renderSentenceList();
}

function closeFlashcardSelect() {
  document.getElementById('flashcardSelectOverlay').style.display = 'none';
}

function renderSentenceList() {
  const list = document.getElementById('sentenceList');
  list.innerHTML = '';
  db.goodSentences.forEach(function(item, i) {
    var itemTag = item.pattern || '未分类';
    if (selectedTag !== '全部' && itemTag !== selectedTag) return;
    const checked = selectedSentenceIndices.indexOf(i) !== -1;
    const match = item.text.match(/^(.*?)[（(](.*?)[）)]$/);
    let displayText = item.text;
    if (match) displayText = match[1].trim();
    if (displayText.length > 60) displayText = displayText.slice(0, 60) + '...';
    
    const row = document.createElement('div');
    row.style.cssText = 'display:flex;align-items:center;gap:12px;padding:12px;border-bottom:1px solid rgba(255,255,255,.1);cursor:pointer';
    row.onclick = function() { toggleSentenceSelect(i); };
    row.innerHTML = 
      '<input type="checkbox" ' + (checked ? 'checked' : '') + ' style="width:20px;height:20px;accent-color:#2d9d5f;cursor:pointer" onclick="event.stopPropagation();toggleSentenceSelect(' + i + ')">' +
      '<span style="color:rgba(255,255,255,.5);font-size:13px;min-width:28px">' + (i+1) + '</span>' +
      '<span style="color:#fff;font-size:14px;flex:1;line-height:1.5">' + displayText + '</span>' +
      (item.pattern ? '<span style="color:rgba(45,157,95,.8);font-size:12px;background:rgba(45,157,95,.15);padding:2px 8px;border-radius:6px">' + item.pattern + '</span>' : '');
    list.appendChild(row);
  });
  updateSelectCount();
}

function toggleSentenceSelect(i) {
  const idx = selectedSentenceIndices.indexOf(i);
  if (idx === -1) {
    selectedSentenceIndices.push(i);
  } else {
    selectedSentenceIndices.splice(idx, 1);
  }
  renderSentenceList();
}

function selectAllSentences(selectAll) {
  var visible = [];
  db.goodSentences.forEach(function(item, i){
    var itemTag = item.pattern || '未分类';
    if (selectedTag !== '全部' && itemTag !== selectedTag) return;
    visible.push(i);
  });
  if (selectAll) {
    visible.forEach(function(i){
      if (selectedSentenceIndices.indexOf(i) === -1) selectedSentenceIndices.push(i);
    });
  } else {
    visible.forEach(function(i){
      var idx = selectedSentenceIndices.indexOf(i);
      if (idx !== -1) selectedSentenceIndices.splice(idx, 1);
    });
  }
  renderSentenceList();
}

function selectRandomSentences() {
  const n = Math.min(5, db.goodSentences.length);
  const all = db.goodSentences.map(function(_, i) { return i; });
  // 随机洗牌取前n个
  for (let i = all.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [all[i], all[j]] = [all[j], all[i]];
  }
  selectedSentenceIndices = all.slice(0, n).sort(function(a,b){return a-b;});
  renderSentenceList();
}

function updateSelectCount() {
  document.getElementById('selectCountLabel').textContent = '已选 ' + selectedSentenceIndices.length + ' 句';
}

function startFlashcardReview() {
  if (selectedSentenceIndices.length === 0) {
    toast('请至少选择一句');
    return;
  }
  closeFlashcardSelect();
  flashcardIndex = 0;
  document.getElementById('flashcardOverlay').style.display = 'flex';
  showCard();
}

function closeFlashcardMode() {
  document.getElementById('flashcardOverlay').style.display = 'none';
}

function toggleFlashcardMode() {
  flashcardMode = flashcardMode === 'cn2en' ? 'en2cn' : 'cn2en';
  document.getElementById('flashcardModeBtn').textContent = flashcardMode === 'cn2en' ? '中→英' : '英→中';
  showCard();
}

function showCard() {
  flashcardFlipped = false;
  document.getElementById('flashcardInner').style.transform = 'rotateY(0deg)';
  
  const actualIndex = selectedSentenceIndices[flashcardIndex];
  const item = db.goodSentences[actualIndex];
  const match = item.text.match(/^(.*?)[（(](.*?)[）)]$/);
  let english, chinese;
  if (match) {
    english = match[1].trim();
    chinese = match[2].trim();
  } else {
    english = item.text;
    chinese = '（无中文翻译）';
  }
  
  if (flashcardMode === 'cn2en') {
    document.querySelector('#flashcardFront div:first-child').textContent = '看中文，说英文';
    document.querySelector('#flashcardBack div:last-child').textContent = '点击返回中文';
    document.getElementById('flashcardChinese').textContent = chinese;
    document.getElementById('flashcardEnglish').textContent = english;
  } else {
    document.querySelector('#flashcardFront div:first-child').textContent = '看英文，说中文';
    document.querySelector('#flashcardBack div:last-child').textContent = '点击返回英文';
    document.getElementById('flashcardChinese').textContent = english;
    document.getElementById('flashcardEnglish').textContent = chinese;
  }
  
  document.getElementById('flashcardPattern').textContent = item.pattern ? '句式：' + item.pattern : '';
  document.getElementById('flashcardProgress').textContent = (flashcardIndex + 1) + ' / ' + selectedSentenceIndices.length;
}

function flipCard() {
  flashcardFlipped = !flashcardFlipped;
  document.getElementById('flashcardInner').style.transform = flashcardFlipped ? 'rotateY(180deg)' : 'rotateY(0deg)';
}

function nextCard() {
  flashcardIndex = (flashcardIndex + 1) % selectedSentenceIndices.length;
  showCard();
}

function prevCard() {
  flashcardIndex = (flashcardIndex - 1 + selectedSentenceIndices.length) % selectedSentenceIndices.length;
  showCard();
}

let scTab = 'students'; // students | entry | analysis
let scExamId = null;
let stuSearch = '';
let scCmpId = '';
let scRankSort = 'rank'; // rank | up | down
let scSubjSort = '';
let scEngSort = 'total'; // total|schoolRank|obj|subj|grammar|sec1|sec2 // 选了科目就按该科进退排

function scExamsSorted() { return (db.exams || []).slice().sort((a,b) => (a.date||'').localeCompare(b.date||'')); }
function scExamById(id) { return (db.exams||[]).find(e => e.id === id); }
function scStudents() { return (db.students||[]).slice().sort((a,b) => String(a.no||'').localeCompare(String(b.no||''), 'zh', {numeric:true})); }
function scCellCls(v, full) {
  if (v === null) return ' miss';
  if (typeof v !== 'number') return '';
  if (v > full || v < 0) return ' bad';
  if (v < full * 0.6) return ' low';
  return '';
}
function scParseScore(t) {
  t = String(t==null?'':t).trim();
  if (t === '') return undefined;
  if (/^(缺|缺考|-|—|\/|x|X)$/i.test(t)) return null;
  var n = parseFloat(t.replace(/[^\d.\-]/g,''));
  return isNaN(n) ? undefined : n;
}
function scSetScore(ex, sid, sub, v) {
  if (!ex.scores[sid]) ex.scores[sid] = {};
  if (v === undefined) delete ex.scores[sid][sub]; else ex.scores[sid][sub] = v;
}
function scTable(ex) {
  var rows = [];
  scStudents().forEach(st => {
    var row = ex.scores[st.id] || {};
    var t = 0, n = 0;
    ex.subjects.forEach(sb => { var v = row[sb.name]; if (typeof v === 'number') { t += v; n++; } });
    if (n) rows.push({ sid: st.id, total: t, subs: row });
  });
  rows.sort((a,b) => b.total - a.total);
  var last = null, lr = 0;
  rows.forEach((r,i) => { if (r.total !== last) { lr = i+1; last = r.total; } r.rank = lr; });
  return rows;
}
function scStats(ex) {
  var table = scTable(ex);
  var full = ex.subjects.reduce((s,x) => s + x.full, 0);
  if (!table.length) return { n:0, full, table, subs:[] };
  var totals = table.map(r => r.total);
  var avg = totals.reduce((a,b)=>a+b,0)/totals.length;
  var sd = Math.sqrt(totals.map(t => (t-avg)*(t-avg)).reduce((a,b)=>a+b,0)/totals.length);
  var maxSid = table.length ? table[0].sid : null;
  var subs = ex.subjects.map(sb => {
    var vals = [];
    scStudents().forEach(st => { var row = ex.scores[st.id]; if (row && typeof row[sb.name]==='number') vals.push(row[sb.name]); });
    if (!vals.length) return { name:sb.name, full:sb.full, n:0 };
    var a = vals.reduce((x,y)=>x+y,0)/vals.length;
    return { name:sb.name, full:sb.full, n:vals.length, avg:a, rate:a/sb.full,
      max:Math.max(...vals), min:Math.min(...vals),
      pass:vals.filter(v=>v>=sb.full*0.6).length/vals.length,
      good:vals.filter(v=>v>=sb.full*0.85).length/vals.length,
      low:vals.filter(v=>v<sb.full*0.6).length };
  });
  return { n:table.length, full, table, subs, avg, sd, maxSid, max:Math.max(...totals), min:Math.min(...totals),
    rate:avg/full, pass:totals.filter(v=>v>=full*0.6).length/table.length,
    good:totals.filter(v=>v>=full*0.85).length/table.length };
}

      <button class="${scTab==='entry'?'on':''}" onclick="scTab='entry';renderPage('scores')">📝 成绩录入</button>
      <button class="${scTab==='analysis'?'on':''}" onclick="scTab='analysis';renderPage('scores')">📊 成绩分析</button>
      <button class="${scTab==='eng'?'on':''}" onclick="scTab='eng';renderPage('scores')">🎯 英语细项</button>

function delStudent(id) {
  if (!confirm('确定删除此学生？其成绩记录也会保留在考试中。')) return;
  db.students = db.students.filter(s => s.id !== id);
  saveDB(); closeModal(); renderPage('scores');
}
function scClearAllStudents() {
  if (!db.students.length) { toast('学生列表已经是空的'); return; }
  if (!confirm('确定要清空全部 ' + db.students.length + ' 名学生吗？\n\n注意：此操作会同时清除所有考试中这些学生的成绩数据，且不可恢复！\n建议先点侧栏"📤导出数据"备份。')) return;
  if (!confirm('再次确认：真的要全部清空吗？')) return;
  db.students = [];
  // 同时清空所有考试里的 scores
  (db.exams||[]).forEach(ex => { ex.scores = {}; });
  saveDB(); renderPage('scores'); toast('已清空全部学生及成绩');
}
function scBulkImportDlg() {
  var body = `<div style="font-size:13px;color:#666;margin-bottom:8px">从Excel复制"学号 姓名"两列（Tab分隔），粘贴到下方：</div>
    <textarea class="ta" id="stBulk" style="min-height:150px;font-family:monospace;font-size:13px" placeholder="01	张三&#10;02	李四&#10;03	王五"></textarea>`;
  openModal('批量导入学生', body, () => {
    var text = document.getElementById('stBulk').value.trim();
    if (!text) return;
    var lines = text.split('\n');
    var n = 0;
    lines.forEach(line => {
      var parts = line.trim().split(/[\t\s]+/);
      if (parts.length >= 2 && parts[1]) { db.students.push({ id: uid(), no: parts[0], name: parts.slice(1).join(' '), tags: [], note: '' }); n++; }
      else if (parts[0]) { db.students.push({ id: uid(), no: '', name: parts[0], tags: [], note: '' }); n++; }
    });
    saveDB(); closeModal(); renderPage('scores'); toast('已导入 ' + n + ' 名学生');
  });
}

          <div class="m">${e.date} · ${e.subjects.length}科 · ${done}/${students.length}</div>
          <div class="prog"><i style="width:${students.length?Math.round(done/students.length*100):0}%"></i></div>

  h += `<div style="display:flex;gap:8px;margin-bottom:10px;align-items:center">
    <div style="font-size:16px;font-weight:700">${escapeHtml(ex.name)}</div>
    <div style="font-size:12px;color:#999">${ex.date} · 满分 ${ex.subjects.reduce((s,x)=>s+x.full,0)}</div>

  <table class="sc-grid"><thead><tr><th>学号</th><th>姓名</th>`;

  var table = scTable(ex); var rkMap = {}; table.forEach(r => rkMap[r.sid] = r);

    h += `<tr><td style="color:#999;font-size:12px">${escapeHtml(st.no||'')}</td><td style="font-weight:600;text-align:left;padding-left:10px">${escapeHtml(st.name)}</td>`;

    });
    h += `<td class="tot">${rk ? rk.total.toFixed(1) : ''}</td><td class="rk">${rk ? rk.rank : ''}</td></tr>`;
  });
  h += `</tbody></table></div></div></div>`;
  return h;
}

// ---- 英语细项分 ----
function scEngDetail(ex) { if (!ex.engDetail) ex.engDetail = {}; return ex.engDetail; }
function scRenderEngDetail() {
  var exs = scExamsSorted().reverse();
  if (!scExamId || !scExamById(scExamId)) scExamId = exs.length ? exs[0].id : null;
  var ex = scExamById(scExamId);
  if (!ex) return `<div class="panel"><div class="empty">还没有考试</div></div>`;
  var ed = scEngDetail(ex);
  var students = scStudents();

  var opts = exs.map(e => `<option value="${e.id}" ${e.id===ex.id?'selected':''}>${escapeHtml(e.name)}</option>`).join('');
  var sortOpts = `<select class="sel" onchange="scEngSort=this.value;renderPage('scores')" style="width:auto;font-size:12px;height:30px">
    <option value="total" ${scEngSort==='total'?'selected':''}>按总分↓</option>
    <option value="schoolRank" ${scEngSort==='schoolRank'?'selected':''}>按校名↑</option>
    <option value="obj" ${scEngSort==='obj'?'selected':''}>按客观题↓</option>
    <option value="subj" ${scEngSort==='subj'?'selected':''}>按主观题↓</option>
    <option value="grammar" ${scEngSort==='grammar'?'selected':''}>按语法填空↓</option>
    <option value="sec1" ${scEngSort==='sec1'?'selected':''}>按第一节↓</option>

  var defaults = ['英语','语文','数学','物理','化学','生物','政治','历史','地理'];
  scFormSubs = defaults.map(n => ({ name: n, full: n === '英语' || n === '语文' || n === '数学' ? 150 : 100 }));
  scFormChosen = {};
  if (ex) {
    ex.subjects.forEach(s => {
      scFormChosen[s.name] = s.full;
      if (!scFormSubs.find(x => x.name === s.name)) scFormSubs.push({ name: s.name, full: s.full });
    });

  }
  var body = `<div class="row2">
    <div class="field"><label>考试名称<span class="req">*</span></label><input class="inp" id="exName" value="${ex?escapeHtml(ex.name):''}" placeholder="如：十一月月考"></div>

    <div class="chips" id="exTypeChips">

  </div>
  <div class="field"><label>科目与满分</label>
    <div style="font-size:12px;color:#999;margin-bottom:6px">点科目名勾选或取消，右侧数字是满分</div>
    <div class="sub-list" id="exSubList"></div>
    <div style="display:flex;gap:6px;margin-top:10px">
      <input class="inp" id="exNewSub" placeholder="添加科目，如：化学" style="width:180px;height:32px">
      <input class="inp" id="exNewFull" value="100" style="width:72px;height:32px">
      <button class="btn btn-light btn-sm" onclick="scAddSub()">添加</button>
    </div>
  </div>
  ${ex?`<button class="btn btn-red btn-sm" onclick="deleteExam('${ex.id}')">删除此考试</button>`:''}`;
  openModal(ex?'编辑考试':'新建考试', body, () => {
    var name = document.getElementById('exName').value.trim();
    var date = document.getElementById('exDate').value;
    if (!name) { toast('请填写考试名称'); return; }
    if (!date) { toast('请选择日期'); return; }
    var type = (document.querySelector('#exTypeChips button.on')||{}).textContent || '月考';
    var subjects = scFormSubs.filter(s => scFormChosen[s.name] !== undefined)
      .map(s => ({ name: s.name, full: scFormChosen[s.name] }));
    if (!subjects.length) { toast('至少选一个科目'); return; }
    if (ex) { ex.name = name; ex.date = date; ex.type = type; ex.subjects = subjects; }
    else { db.exams.push({ id: uid(), name, date, type, subjects, scores: {} }); scExamId = db.exams[db.exams.length-1].id; }
    saveDB(); closeModal(); renderPage('scores'); toast('已保存');
  });
  scRenderSubList();
}
function scRenderSubList() {
  var el = document.getElementById('exSubList'); if (!el) return;
  el.innerHTML = scFormSubs.map((s, i) => {
    var on = scFormChosen[s.name] !== undefined;
    return `<span class="sub-item ${on?'on':''}">
      <span style="cursor:pointer" onclick="scToggleSub(${i})">${escapeHtml(s.name)}</span>
      <input value="${on?scFormChosen[s.name]:s.full}" ${on?'':'disabled'} oninput="scSetFull(${i}, this.value)" aria-label="${escapeHtml(s.name)}满分">
    </span>`;
  }).join('');
}
function scToggleSub(i) {
  var s = scFormSubs[i];
  if (scFormChosen[s.name] !== undefined) delete scFormChosen[s.name];
  else scFormChosen[s.name] = s.full;
  scRenderSubList();
}
function scSetFull(i, v) {
  var s = scFormSubs[i];
  var n = parseFloat(v);
  if (n > 0) scFormChosen[s.name] = n;
}
function scAddSub() {
  var n = document.getElementById('exNewSub').value.trim();
  var f = parseFloat(document.getElementById('exNewFull').value) || 100;
  if (!n) return;
  if (!scFormSubs.find(s => s.name === n)) scFormSubs.push({ name: n, full: f });
  scFormChosen[n] = f;
  document.getElementById('exNewSub').value = '';
  scRenderSubList();
}
function deleteExam(id) {
  if (!confirm('确定删除此考试及全部成绩？')) return;
  db.exams = db.exams.filter(e => e.id !== id);
  scExamId = null; saveDB(); closeModal(); renderPage('scores');
}

// AI分析报告
function scBuildContext() {
  var ex = scExamById(scExamId); if (!ex) return '';
  var st = scStats(ex); if (!st.n) return '';
  var h = '【考试数据】' + ex.name + '（' + ex.date + '，' + (ex.type||'') + '），参考 ' + st.n + ' 人，满分 ' + st.full + '\n';
  h += '总分：平均 ' + st.avg.toFixed(1) + '，最高 ' + st.max.toFixed(1) + '，最低 ' + st.min.toFixed(1) + '，及格率 ' + (st.pass*100).toFixed(0) + '%，优秀率 ' + (st.good*100).toFixed(0) + '%\n';
  h += '各科：\n' + st.subs.filter(s=>s.n).map(s => '- ' + s.name + '（满分' + s.full + '）：平均 ' + s.avg.toFixed(1) + '，得分率 ' + (s.rate*100).toFixed(0) + '%，及格率 ' + (s.pass*100).toFixed(0) + '%，优秀率 ' + (s.good*100).toFixed(0) + '%，最高 ' + s.max + '，最低 ' + s.min + '，不及格 ' + (s.low||0) + '人').join('\n') + '\n';
  var students = scStudents();
  h += '前5名：' + st.table.slice(0,5).map(r => { var s = students.find(x=>x.id===r.sid); return (s?s.name:'?') + ' ' + r.total.toFixed(1); }).join('、') + '\n';
  var fails = st.table.filter(r => { var n=0; ex.subjects.forEach(sb => { var v=r.subs[sb.name]; if (typeof v==='number' && v < sb.full*0.6) n++; }); return n>=2; });
  h += '两科及以上不及格：' + fails.length + '人' + (fails.length ? '（' + fails.map(r => { var s=students.find(x=>x.id===r.sid); return s?s.name:'?'; }).join('、') + '）' : '') + '\n';
  return h;
}
function scAIReport() {

  box.scrollTop = box.scrollHeight;

    box.scrollTop = box.scrollHeight;
  });
}
function scAiAsk() {

// 按表头导入成绩
function openScoreImport(exId) {
  var ex = scExamById(exId); if (!ex) return;
  var subTags = ex.subjects.map(s => `<span class="tag" style="margin:0 2px">${escapeHtml(s.name)}</span>`).join('');
  var body = `<p style="margin:0 0 12px;color:#666;line-height:1.7;font-size:13px">从 Excel 复制带表头的成绩表粘贴进来（顺序不限）。需要有「姓名」或「学号」列，科目列名要和考试科目一致：${subTags}</p>
    <textarea class="ta" id="scImp" style="min-height:200px;font-family:monospace;font-size:13px" placeholder="姓名	语文	数学	英语&#10;张三	98	105	110" oninput="scImpPreview()"></textarea>
    <div id="scImpInfo" style="font-size:12.5px;margin-top:8px;color:#666"></div>`;
  openModal('按表头导入成绩 · ' + ex.name, body, () => {
    var text = document.getElementById('scImp').value.trim();
    if (!text) { closeModal(); return; }
    var rows = text.split('\n').map(r => r.split('\t'));
    if (rows.length < 2) { toast('请至少粘贴表头+一行数据'); return; }
    var head = rows[0].map(x => x.replace(/\s/g, ''));
    var ni = head.indexOf('姓名'); if (ni < 0) ni = head.indexOf('名字');
    var noi = head.indexOf('学号');
    var cols = {};
    ex.subjects.forEach(s => { var i = head.indexOf(s.name); if (i >= 0) cols[s.name] = i; });
    if (ni < 0 && noi < 0) { toast('没找到「姓名」或「学号」列'); return; }
    var n = 0, miss = [];
    rows.slice(1).forEach(r => {
      var st = scFindStudent(r[ni], r[noi]);
      if (!st) { miss.push(r[ni] || r[noi] || '?'); return; }
      Object.keys(cols).forEach(sub => {
        var v = scParseScore(r[cols[sub]]);
        if (v !== undefined) scSetScore(ex, st.id, sub, v);
      });
      n++;
    });
    saveDB(); closeModal(); renderPage('scores');
    toast('导入 ' + n + ' 名学生成绩' + (miss.length ? '，' + miss.length + ' 行没对上：' + miss.slice(0,5).join('、') : ''));
  });
}
function scFindStudent(name, no) {
  name = (name||'').trim(); no = (no||'').trim();
  if (no) { var byNo = db.students.find(s => String(s.no) === no); if (byNo) return byNo; }
  if (name) { var m = db.students.filter(s => s.name === name); if (m.length === 1) return m[0]; }
  return null;
}
function scImpPreview() {
  var ex = scExamById(scExamId); if (!ex) return;
  var text = document.getElementById('scImp').value.trim();
  var info = document.getElementById('scImpInfo');
  if (!text) { info.textContent = ''; return; }
  var rows = text.split('\n').map(r => r.split('\t'));
  if (rows.length < 2) { info.textContent = ''; return; }
  var head = rows[0].map(x => x.replace(/\s/g, ''));
  var ni = head.indexOf('姓名'); if (ni < 0) ni = head.indexOf('名字');
  var noi = head.indexOf('学号');
  if (ni < 0 && noi < 0) { info.innerHTML = '<span style="color:#dc2626">没找到「姓名」或「学号」列</span>'; return; }
  var cols = {};
  ex.subjects.forEach(s => { var i = head.indexOf(s.name); if (i >= 0) cols[s.name] = i; });
  var matched = 0;
  rows.slice(1).forEach(r => { if (scFindStudent(r[ni], r[noi])) matched++; });
  info.innerHTML = `共 <b>${rows.length-1}</b> 行，匹配到 <b style="color:#16a34a">${matched}</b> 名学生；识别科目：${Object.keys(cols).join('、') || '<span style="color:#dc2626">无</span>'}`;
}

// CSV导出
function scExportCSV() {
  var ex = scExamById(scExamId); if (!ex) return;
  var students = scStudents();
  var rows = [['学号','姓名'].concat(ex.subjects.map(s=>s.name)).concat(['总分','排名'])];
  var table = scTable(ex); var rkMap = {}; table.forEach(r => rkMap[r.sid] = r);
  students.forEach(st => {
    var row = ex.scores[st.id] || {}; var r = rkMap[st.id];
    rows.push([st.no||'', st.name].concat(ex.subjects.map(sb => { var v = row[sb.name]; return v===null?'缺考':v===undefined?'':v; })).concat([r?r.total.toFixed(1):'', r?r.rank:'']));
  });
  var blob = new Blob(['\ufeff'+rows.map(r=>r.join(',')).join('\n')], {type:'text/csv;charset=utf-8'});
  var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = ex.name+'.csv'; a.click();
}

    var totCell = tr.querySelector('td.tot'); var rkCell = tr.querySelector('td.rk');
